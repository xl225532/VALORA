<div class="sync-page">

<section class="sync-card">

<h3>

رمز التزامن

</h3>


<p>

أدخل رمز التزامن الخاص بالصفقة

</p>



</section>







<section class="sync-form">



<label>

رمز التزامن

</label>



<input 
type="text"
id="syncCode"
placeholder="أدخل الرمز">






<button onclick="checkCode()">

تحقق

</button>






<p id="result"></p>

<script>


function checkCode(){


let code =
document.getElementById("syncCode").value;



let result =
document.getElementById("result");



if(code.trim()==""){


result.innerHTML="يرجى إدخال الرمز";


return;


}




/*
هنا لاحقاً يتم ربط التحقق مع قاعدة البيانات
*/


result.innerHTML="جاري التحقق...";



}



</script>
