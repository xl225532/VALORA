<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | استرجاع كلمة المرور</title>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="css/login.css">

<link rel="stylesheet" href="css/background.css">

<style>

/* ==========================================
   FORGOT PASSWORD
========================================== */

.error-box{

    display:none;

    margin-top:15px;

    padding:12px 15px;

    border:1px solid #ff4d4d;

    background:rgba(255,77,77,.08);

    border-radius:12px;

    color:#ff6b6b;

    font-size:13px;

    line-height:1.7;

    text-align:center;

}


.error-box.show{

    display:block;

}


.success-box{

    display:none;

    margin-top:15px;

    padding:14px 15px;

    border:1px solid #1687FF;

    background:rgba(22,135,255,.08);

    border-radius:12px;

    color:#fff;

    font-size:13px;

    line-height:1.8;

    text-align:center;

}


.success-box.show{

    display:block;

}


.step{

    display:none;

}


.step.active{

    display:block;

}


.code-note{

    margin-top:10px;

    color:#98A5B8;

    font-size:12px;

    line-height:1.7;

    text-align:center;

}


.back-login{

    margin-top:20px;

    text-align:center;

}


.back-login a{

    color:#1687FF;

    text-decoration:none;

    font-size:14px;

}


/* زر إرسال الرمز */

.secondary-btn{

    width:100%;

    height:50px;

    margin-top:10px;

    border:none;

    border-radius:14px;

    background:#1687FF;

    color:#fff;

    font-family:'Cairo',Arial,sans-serif;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

}


.step-title{

    margin-bottom:15px;

    color:#fff;

    font-size:18px;

    font-weight:700;

    text-align:center;

}


.step-description{

    margin-bottom:20px;

    color:#98A5B8;

    font-size:13px;

    line-height:1.8;

    text-align:center;

}


.input-group{

    margin-bottom:15px;

}


.input-group label{

    display:block;

    margin-bottom:7px;

}


.input-group input{

    width:100%;

}


/* إخفاء الخطوة الثانية والثالثة */

#step2,
#step3{

    display:none;

}

#step2.active,
#step3.active{

    display:block;

}

</style>

</head>


<body>


<div class="login-container">


    <!-- ======================================
         LOGO
    ======================================= -->

    <div class="logo">

        VALORA

    </div>



    <!-- ======================================
         TITLE
    ======================================= -->

    <div
        class="subtitle"
        data-lang="forgot_password_title"
    >

        استرجاع كلمة المرور

    </div>



    <!-- ======================================
         STEP 1
    ======================================= -->

    <div
        class="step active"
        id="step1"
    >

        <div class="step-title">

            <span data-lang="forgot_password_title">

                استرجاع كلمة المرور

            </span>

        </div>


        <div class="step-description">

            <span data-lang="forgot_password_description">

                أدخل البريد الإلكتروني أو رقم الهاتف المسجل في حسابك.

            </span>

        </div>



        <form id="forgotForm">


            <div class="input-group">


                <label data-lang="forgot_email_phone">

                    البريد الإلكتروني أو رقم الهاتف

                </label>



                <input
                    type="text"
                    id="forgotInput"
                    placeholder="أدخل البريد أو رقم الهاتف"
                    data-lang-placeholder="forgot_email_phone_placeholder"
                    autocomplete="username"
                >


            </div>



            <button
                class="login-btn"
                type="submit"
            >

                <span data-lang="send_verification_code">

                    إرسال رمز التحقق

                </span>

            </button>


        </form>


        <div
            class="error-box"
            id="errorBox1"
        ></div>


    </div>



    <!-- ======================================
         STEP 2
    ======================================= -->

    <div
        class="step"
        id="step2"
    >

        <div class="step-title">

            <span data-lang="verification_code">

                رمز التحقق

            </span>

        </div>


        <div class="step-description">

            <span data-lang="verification_description">

                أدخل رمز التحقق الذي تم إرساله إليك.

            </span>

        </div>



        <div class="input-group">


            <label data-lang="verification_code">

                رمز التحقق

            </label>



            <input
                type="text"
                id="verificationCode"
                maxlength="6"
                inputmode="numeric"
                placeholder="أدخل رمز التحقق"
                data-lang-placeholder="verification_code_placeholder"
            >


        </div>



        <button
            class="login-btn"
            type="button"
            onclick="verifyCode()"
        >

            <span data-lang="verify_code_btn">

                تحقق من الرمز

            </span>

        </button>


        <div
            class="error-box"
            id="errorBox2"
        ></div>


        <div
            class="success-box"
            id="codeSuccess"
        ></div>


    </div>



    <!-- ======================================
         STEP 3
    ======================================= -->

    <div
        class="step"
        id="step3"
    >

        <div class="step-title">

            <span data-lang="new_password_title">

                إنشاء كلمة مرور جديدة

            </span>

        </div>


        <div class="step-description">

            <span data-lang="new_password_description">

                أدخل كلمة المرور الجديدة ثم قم بتأكيدها.

            </span>

        </div>



        <div class="input-group">


            <label data-lang="new_password">

                كلمة المرور الجديدة

            </label>



            <input
                type="password"
                id="newPassword"
                placeholder="********"
                data-lang-placeholder="new_password_placeholder"
                autocomplete="new-password"
            >


        </div>



        <div class="input-group">


            <label data-lang="confirm_password">

                تأكيد كلمة المرور

            </label>



            <input
                type="password"
                id="confirmPassword"
                placeholder="********"
                data-lang-placeholder="confirm_password_placeholder"
                autocomplete="new-password"
            >


        </div>



        <button
            class="login-btn"
            type="button"
            onclick="resetPassword()"
        >

            <span data-lang="reset_password_btn">

                إعادة تعيين كلمة المرور

            </span>

        </button>


        <div
            class="error-box"
            id="errorBox3"
        ></div>


        <div
            class="success-box"
            id="resetSuccess"
        ></div>


    </div>



    <!-- ======================================
         LOGIN LINK
    ======================================= -->

    <div class="register">


        <span data-lang="remember_password">

            تذكرت كلمة المرور؟

        </span>


        <a
            href="login.html"
            data-lang="login_btn"
        >

            تسجيل الدخول

        </a>


    </div>



</div>



<!-- ==========================================
     LANGUAGE SYSTEM
========================================== -->

<script src="js/language.js"></script>



<script>

let verificationCode = "";

let userContact = "";



/* ==========================================
   LANGUAGE
========================================== */

if(typeof applyLanguage === "function"){

    applyLanguage();

}



/* ==========================================
   TRANSLATION HELPER
========================================== */

function translate(key, fallback){

    if(typeof t === "function"){

        const result = t(key);

        if(result && result !== key){

            return result;

        }

    }

    return fallback;

}



/* ==========================================
   SHOW ERROR
========================================== */

function showError(id, key, fallback){

    const box =
        document.getElementById(id);


    box.textContent =
        translate(key, fallback);


    box.classList.add("show");

}



/* ==========================================
   HIDE ERROR
========================================== */

function hideError(id){

    const box =
        document.getElementById(id);


    box.textContent = "";

    box.classList.remove("show");

}



/* ==========================================
   SHOW SUCCESS
========================================== */

function showSuccess(id, key, fallback){

    const box =
        document.getElementById(id);


    box.textContent =
        translate(key, fallback);


    box.classList.add("show");

}



/* ==========================================
   HIDE SUCCESS
========================================== */

function hideSuccess(id){

    const box =
        document.getElementById(id);


    box.textContent = "";

    box.classList.remove("show");

}



/* ==========================================
   STEP 1
   SEND VERIFICATION CODE
========================================== */

document
.getElementById("forgotForm")
.addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        hideError("errorBox1");


        const input =
            document
            .getElementById("forgotInput");


        const contact =
            input.value.trim();


        if(contact === ""){

            showError(
                "errorBox1",
                "forgot_contact_required",
                "يرجى إدخال البريد الإلكتروني أو رقم الهاتف"
            );

            return;

        }


        /*
         * نحفظ وسيلة الاتصال مؤقتًا
         */

        userContact = contact;


        /*
         * إنشاء رمز تحقق تجريبي
         */

        verificationCode =
            String(
                Math.floor(
                    100000 +
                    Math.random() * 900000
                )
            );


        /*
         * حفظ الرمز مؤقتًا
         */

        try{

            localStorage.setItem(
                "VALORA_RESET_CODE",
                verificationCode
            );

            localStorage.setItem(
                "VALORA_RESET_CONTACT",
                userContact
            );

        }catch(error){

            console.warn(
                "VALORA reset storage error:",
                error
            );

        }


        /*
         * الانتقال إلى الخطوة الثانية
         */

        document
        .getElementById("step1")
        .classList.remove("active");


        document
        .getElementById("step2")
        .classList.add("active");


        /*
         * إظهار ملاحظة تجريبية
         * لاحقًا تستبدل بإرسال SMS / Email حقيقي
         */

        const success =
            document.getElementById(
                "codeSuccess"
            );


        success.textContent =
            translate(
                "verification_demo_code",
                "رمز التحقق التجريبي: "
            )
            +
            verificationCode;


        success.classList.add("show");


    }
);



/* ==========================================
   STEP 2
   VERIFY CODE
========================================== */

function verifyCode(){

    hideError("errorBox2");


    const entered =
        document
        .getElementById("verificationCode")
        .value
        .trim();


    if(entered === ""){

        showError(
            "errorBox2",
            "verification_required",
            "يرجى إدخال رمز التحقق"
        );

        return;

    }


    if(!/^\d{6}$/.test(entered)){

        showError(
            "errorBox2",
            "verification_invalid_format",
            "رمز التحقق يجب أن يتكون من 6 أرقام"
        );

        return;

    }


    if(entered !== verificationCode){

        showError(
            "errorBox2",
            "verification_code_invalid",
            "رمز التحقق غير صحيح"
        );

        return;

    }


    /*
     * الانتقال إلى الخطوة الثالثة
     */

    document
    .getElementById("step2")
    .classList.remove("active");


    document
    .getElementById("step3")
    .classList.add("active");

}



/* ==========================================
   STEP 3
   RESET PASSWORD
========================================== */

function resetPassword(){

    hideError("errorBox3");

    hideSuccess("resetSuccess");


    const password =
        document
        .getElementById("newPassword")
        .value;


    const confirm =
        document
        .getElementById("confirmPassword")
        .value;



    if(password === ""){

        showError(
            "errorBox3",
            "new_password_error",
            "أدخل كلمة المرور الجديدة"
        );

        return;

    }



    if(password.length < 6){

        showError(
            "errorBox3",
            "new_password_length_error",
            "يجب أن تكون كلمة المرور 6 أحرف على الأقل"
        );

        return;

    }



    if(confirm === ""){

        showError(
            "errorBox3",
            "confirm_password_error",
            "أعد إدخال كلمة المرور"
        );

        return;

    }



    if(password !== confirm){

        showError(
            "errorBox3",
            "password_mismatch",
            "كلمة المرور غير متطابقة"
        );

        return;

    }



    /*
     * حفظ كلمة المرور الجديدة
     */

    try{

        localStorage.setItem(
            "VALORA_PASSWORD",
            password
        );

    }catch(error){

        console.warn(
            "VALORA password save error:",
            error
        );

    }



    showSuccess(
        "resetSuccess",
        "password_changed_success",
        "تم تغيير كلمة المرور بنجاح"
    );



    /*
     * الانتقال إلى تسجيل الدخول
     */

    setTimeout(function(){

        window.location.href =
