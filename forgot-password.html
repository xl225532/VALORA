<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | استرجاع كلمة المرور</title>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="css/login.css">

<link rel="stylesheet" href="css/background.css">

</head>


<body>


<div class="login-container">


    <!-- =========================
         LOGO
    ========================== -->

    <div class="logo">

        VALORA

    </div>



    <!-- =========================
         TITLE
    ========================== -->

    <div
        class="subtitle"
        data-lang="forgot_password_title"
    >

        استرجاع كلمة المرور

    </div>



    <!-- =========================
         FORM
    ========================== -->

    <form id="forgotForm">


        <div class="input-group">


            <label data-lang="forgot_email_phone">

                البريد الإلكتروني أو رقم الهاتف

            </label>



            <input
                type="text"
                id="forgotInput"
                placeholder="أدخل البريد أو رقم الهاتف"
                data-lang-placeholder="forgot_email_phone_placeholder"
                required
            >


        </div>



        <button
            class="login-btn"
            type="submit"
        >

            <span data-lang="forgot_submit">

                إرسال طلب الاسترجاع

            </span>

        </button>


    </form>



    <!-- =========================
         LOGIN LINK
    ========================== -->

    <div class="register">

        <span data-lang="remember_password">

            تذكرت كلمة المرور؟

        </span>


        <a
            href="login.html"
            data-lang="login_btn"
        >

            تسجيل الدخول

        </a>

    </div>



</div>



<!-- =========================
     LANGUAGE SYSTEM
========================== -->

<script src="js/language.js"></script>



<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        if(typeof applyLanguage === "function"){

            applyLanguage();

        }

    }
);


document
.getElementById("forgotForm")
.addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        let box =
            document.createElement("div");


        box.className =
            "success-box";


        box.innerHTML = `

            <div class="success-icon">

                <svg viewBox="0 0 52 52">

                    <circle
                        cx="26"
                        cy="26"
                        r="24">
                    </circle>

                    <path
                        d="M14 27 L22 35 L38 18">
                    </path>

                </svg>

            </div>


            <h3 data-lang="reset_request_sent">

                تم إرسال الطلب

            </h3>


            <p data-lang="reset_request_message">

                سيتم التحقق من البيانات وإكمال الاسترجاع

            </p>

        `;


        document.body.appendChild(box);


        // تطبيق اللغة على رسالة النجاح

        if(typeof applyLanguage === "function"){

            applyLanguage();

        }

    }
);

</script>


</body>

</html>
