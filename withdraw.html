<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | السحب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/withdraw.css">

</head>


<body class="valora-withdraw">


<div class="withdraw-container">



<header class="withdraw-header">

<div class="withdraw-logo">
VALORA
</div>

</header>





<section class="withdraw-title">


<div class="withdraw-icon">
↑
</div>


<h2>
سحب العملات
</h2>


<p>
اختر العملة وأدخل بيانات السحب
</p>


</section>







<section class="withdraw-coins">



<button class="withdraw-coin active">

<div class="withdraw-coin-icon usdt">
₮
</div>


<div>
<strong>
USDT
</strong>

<small>
TRC20
</small>

</div>

</button>





<button class="withdraw-coin">


<div class="withdraw-coin-icon btc">
₿
</div>


<div>
<strong>
BTC
</strong>

<small>
Bitcoin
</small>

</div>

</button>





<button class="withdraw-coin">


<div class="withdraw-coin-icon eth">
◆
</div>


<div>
<strong>
ETH
</strong>

<small>
Ethereum
</small>

</div>

</button>



</section>









<section class="withdraw-card">



<div class="withdraw-input">


<label>
عنوان محفظة السحب
</label>


<input id="withdrawAddress"
type="text"
placeholder="أدخل عنوان المحفظة">

</div>







<div class="withdraw-input">


<label>
المبلغ
</label>


<input id="withdrawAmount"
type="number"
placeholder="أدخل المبلغ">

</div>







<div class="withdraw-info">


<div>

<span>
الحد الأدنى
</span>

<strong>
10 USDT
</strong>

</div>




<div>

<span>
العمولة
</span>

<strong>
1 USDT
</strong>

</div>




<div>

<span>
المستلم
</span>

<strong id="receiveAmount">
0.00 USDT
</strong>

</div>


</div>








<button class="withdraw-button" onclick="submitWithdraw()">

تأكيد السحب

</button>









<div id="successBox" class="withdraw-status success">


<h3>
✓ تم إرسال طلب السحب
</h3>


<p>
السحب قيد المعالجة
</p>


</div>








<div id="rejectBox" class="withdraw-status reject">


<h3>
× رفض السحب
</h3>


<p>
يرجى إدخال البيانات كاملة
</p>


</div>








<a href="withdraw-history.html" class="withdraw-history">

سجل السحوبات

</a>




</section>








<nav class="withdraw-nav">


<a href="dashboard.html">

⌂
<br>
الرئيسية

</a>



<a href="wallet.html">

▣
<br>
المحفظة

</a>



<a href="team.html">

♟
<br>
الفريق

</a>



<a href="settings.html">

⚙
<br>
الإعدادات

</a>



</nav>







</div>










<script>


document
.getElementById("withdrawAmount")
.addEventListener("input",function(){


let amount = Number(this.value);


let receive = amount - 1;


if(receive < 0){

receive = 0;

}


document.getElementById("receiveAmount").innerHTML =
receive.toFixed(2)+" USDT";


});








function submitWithdraw(){


let address =
document.getElementById("withdrawAddress").value;


let amount =
document.getElementById("withdrawAmount").value;





document.getElementById("successBox").style.display="none";

document.getElementById("rejectBox").style.display="none";






if(address==="" || amount===""){


document.getElementById("rejectBox").style.display="block";


return;

}





let withdrawal={

coin:"USDT",

network:"TRC20",

amount:amount,

address:address,

date:new Date().toLocaleString("ar-EG"),

status:"pending"

};





let list =
JSON.parse(localStorage.getItem("withdrawals")) || [];


list.push(withdrawal);


localStorage.setItem(
"withdrawals",
JSON.stringify(list)
);





document.getElementById("successBox").style.display="block";



}



</script>






</body>

</html>
