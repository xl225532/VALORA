<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>VALORA | Withdraw</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/withdraw.css">

<link rel="stylesheet" href="css/background.css">


</head>



<body class="valora-withdraw">


<div class="withdraw-container">



<!-- HEADER -->

<header class="withdraw-header">


<div class="withdraw-logo">

VALORA

</div>


</header>





<!-- TITLE -->

<section class="withdraw-title">


<div class="withdraw-icon">

↑

</div>



<h2 data-lang="withdraw_title">

Withdraw Coins

</h2>



<p data-lang="withdraw_subtitle">

Withdraw your assets safely

</p>


</section>







<!-- BALANCE -->

<section class="balance-card">


<span data-lang="available_balance">

Available Balance

</span>


<h2 id="availableBalance">

0.00 USDT

</h2>


</section>








<!-- COINS -->

<section class="withdraw-coins">



<button class="withdraw-coin active" onclick="selectWithdrawCoin('USDT',this)">


<div class="coin-icon usdt">

₮

</div>


<div>

<strong>

USDT

</strong>


<small>

Tether

</small>


</div>


</button>






<button class="withdraw-coin" onclick="selectWithdrawCoin('BTC',this)">


<div class="coin-icon btc">

₿

</div>


<div>

<strong>

BTC

</strong>


<small>

Bitcoin

</small>


</div>


</button>






<button class="withdraw-coin" onclick="selectWithdrawCoin('ETH',this)">


<div class="coin-icon eth">

◆

</div>


<div>

<strong>

ETH

</strong>


<small>

Ethereum

</small>


</div>


</button>


</section>
<!-- WITHDRAW FORM -->

<section class="withdraw-card">



<h3 data-lang="withdraw_network">

Withdrawal Network

</h3>



<div class="network-buttons" id="withdrawNetwork">


</div>







<h3 data-lang="withdraw_address">

Withdrawal Address

</h3>




<div class="input-area">


<input

type="text"

id="withdrawAddress"

data-lang-placeholder="withdraw_address_placeholder"

placeholder="Enter withdrawal address"

>


</div>







<h3 data-lang="withdraw_amount">

Withdrawal Amount

</h3>




<div class="input-area">


<input

type="number"

id="withdrawAmount"

data-lang-placeholder="withdraw_amount_placeholder"

placeholder="Enter amount"

>


</div>







<button

class="withdraw-btn"

onclick="submitWithdraw()"

>


<span data-lang="confirm_withdraw">

Confirm Withdrawal

</span>


</button>







<div

id="withdrawMessage"

class="withdraw-message"

>

</div>



</section>






</div>









<!-- LANGUAGE -->

<script src="js/language.js"></script>



<!-- WITHDRAW SYSTEM -->

<script src="js/withdraw.js"></script>






<script>


document.addEventListener(

"DOMContentLoaded",

function(){


if(typeof applyLanguage === "function"){

applyLanguage();

}


}

);



</script>



</body>

</html>
