<script>


let currentCoin = "USDT";


let currentNetwork = "TRC20";





const coinNetworks = {


USDT:[

"TRC20",

"ERC20"

],


BTC:[

"Bitcoin"

],


ETH:[

"ERC20"

],


TRX:[

"TRC20"

]


};








function selectCoin(coin,button){


currentCoin = coin;



document.querySelectorAll(".withdraw-coin")
.forEach(btn=>{


btn.classList.remove("active");


});



button.classList.add("active");



loadNetworks();



document.getElementById("receiveAmount").innerHTML =

"0.00 "+coin;


}








function loadNetworks(){


let box =

document.getElementById("withdrawNetworkBox");



box.innerHTML="";



coinNetworks[currentCoin].forEach((network,index)=>{


let btn = document.createElement("button");



btn.className="network";


btn.innerText=network;



if(index===0){


btn.classList.add("active");


currentNetwork=network;


}





btn.onclick=function(){


document.querySelectorAll(".network")
.forEach(x=>x.classList.remove("active"));



this.classList.add("active");


currentNetwork=network;


};



box.appendChild(btn);



});


}









document.getElementById("withdrawAmount")
.addEventListener("input",function(){



let amount = Number(this.value);



let fee = amount * 0.20;



let receive = amount - fee;



if(receive < 0){

receive = 0;

}



document.getElementById("receiveAmount").innerHTML =


receive.toFixed(2)+" "+currentCoin;



});









function submitWithdraw(){



let address =

document.getElementById("withdrawAddress").value;



let amount =

Number(document.getElementById("withdrawAmount").value);



let pin =

document.getElementById("withdrawPin").value;






document.getElementById("successBox").style.display="none";

document.getElementById("rejectBox").style.display="none";






if(address==="" || amount < 50 || pin===""){


document.getElementById("rejectBox").style.display="block";


return;


}






let withdrawal = {


coin:currentCoin,


network:currentNetwork,


amount:amount,


address:address,


status:"بانتظار المراجعة",


date:new Date().toLocaleString("ar-EG")


};






let list =

JSON.parse(

localStorage.getItem("VALORA_WITHDRAWALS")

) || [];





list.push(withdrawal);





localStorage.setItem(

"VALORA_WITHDRAWALS",

JSON.stringify(list)

);





document.getElementById("successBox").style.display="block";



}







loadNetworks();



</script>
