<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>VALORA | Withdraw</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/withdraw.css">

<link rel="stylesheet" href="css/background.css">


</head>


<body class="valora-withdraw">


<div class="withdraw-container">



<!-- HEADER -->

<header class="withdraw-header">


<div class="withdraw-logo">

VALORA

</div>


</header>





<!-- TITLE -->

<section class="withdraw-title">


<div class="withdraw-icon">

↑

</div>



<h2 data-lang="withdraw_title">

سحب العملات

</h2>



<p data-lang="withdraw_subtitle">

اسحب أصولك بأمان

</p>


</section>







<!-- BALANCE -->


<section class="balance-card">


<span data-lang="available_balance">

الرصيد المتاح

</span>



<h2 id="availableBalance">

0.00 USDT

</h2>


</section>







<!-- COINS -->

<section class="withdraw-coins">



<!-- USDT -->

<button 
class="withdraw-coin active"
onclick="selectWithdrawCoin('USDT',this)"
>


<div class="coin-icon usdt">

₮

</div>


<strong>

USDT

</strong>


<small data-lang="tether">

Tether

</small>


</button>





<!-- BTC -->

<button 
class="withdraw-coin"
onclick="selectWithdrawCoin('BTC',this)"
>


<div class="coin-icon btc">

₿

</div>


<strong>

BTC

</strong>


<small data-lang="bitcoin">

Bitcoin

</small>


</button>





<!-- ETH -->

<button 
class="withdraw-coin"
onclick="selectWithdrawCoin('ETH',this)"
>


<div class="coin-icon eth">

◆

</div>


<strong>

ETH

</strong>


<small data-lang="ethereum">

Ethereum

</small>


</button>





<!-- TRX -->

<button 
class="withdraw-coin"
onclick="selectWithdrawCoin('TRX',this)"
>


<div class="coin-icon trx">

TRX

</div>


<strong>

TRX

</strong>


<small data-lang="tron">

TRON

</small>


</button>



</section>
<!-- WITHDRAW FORM -->

<section class="withdraw-card">



<!-- NETWORK -->

<h3 data-lang="withdraw_network">

شبكة السحب

</h3>



<div 
class="network-buttons" 
id="withdrawNetwork">

</div>







<!-- ADDRESS -->

<h3 data-lang="withdraw_address">

عنوان السحب

</h3>



<div class="input-area">


<input

type="text"

id="withdrawAddress"

data-lang-placeholder="withdraw_address_placeholder"

placeholder="أدخل عنوان المحفظة"

>


</div>







<!-- AMOUNT -->

<h3 data-lang="withdraw_amount">

مبلغ السحب

</h3>



<div class="input-area">


<input

type="number"

id="withdrawAmount"

oninput="calculateWithdraw()"

data-lang-placeholder="withdraw_amount_placeholder"

placeholder="أدخل مبلغ السحب"

>


</div>








<!-- SECURITY CODE -->

<h3 data-lang="security_code">

رمز أمان السحب

</h3>



<div class="input-area">


<input

type="password"

id="withdrawSecurityCode"

data-lang-placeholder="security_code_placeholder"

placeholder="أدخل رمز أمان السحب"

>


</div>







<!-- WITHDRAW INFO -->


<div class="withdraw-info">



<div>


<span data-lang="withdraw_fee">

رسوم السحب

</span>


<strong id="withdrawFee">

0.00 USDT

</strong>


</div>





<div>


<span data-lang="receive_amount">

المبلغ المستلم

</span>


<strong id="receiveAmount">

0.00 USDT

</strong>


</div>



</div>







<!-- FEE NOTE -->


<div 
class="fee-note"
data-lang="fee_note"
>


قبل التضعيف: 20%
<br>
بعد التضعيف: 5%


</div>







<!-- BUTTON -->


<button

class="withdraw-btn"

onclick="submitWithdraw()"

>


<span data-lang="confirm_withdraw">

تأكيد السحب

</span>


</button>







<!-- MESSAGE -->


<div

id="withdrawMessage"

class="withdraw-message"

>

</div>




</section>
</div>



<!-- LANGUAGE SYSTEM -->

<script src="js/language.js"></script>



<!-- WITHDRAW SYSTEM -->

<script src="js/withdraw.js"></script>





<script>

document.addEventListener(
"DOMContentLoaded",
function(){


if(typeof applyLanguage === "function"){

applyLanguage();

}


}

);

</script>



</body>

</html>
