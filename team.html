<script src="js/language.js"></script>


<script>


applyLanguage();



let user = JSON.parse(localStorage.getItem("VALORA_USER"));



if(user){


let code = user.referralCode;



document.getElementById("myReferralCode").innerText = code;



let link = window.location.origin + "/register.html?ref=" + code;



document.getElementById("referralLink").innerText = link;


}






function copyReferral(){


let link = document.getElementById("referralLink").innerText;



navigator.clipboard.writeText(link);



alert("تم نسخ رابط الدعوة");


}







function copyCode(){


let code = document.getElementById("myReferralCode").innerText;



navigator.clipboard.writeText(code);



alert("تم نسخ كود الإحالة");


}
