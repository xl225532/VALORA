<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | التزامن</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sync.css">

</head>

<body>

<div class="sync-page">

<header class="sync-header">

<div class="sync-brand">
VALORA
</div>

</header>


<!-- العملات -->

<section class="coin-slider">

<div class="market-box active">
<b>BTC</b>
<span class="green">+2.34%</span>
</div>

<div class="market-box">
<b>ETH</b>
<span class="red">-0.87%</span>
</div>

<div class="market-box">
<b>BNB</b>
<span class="green">+1.12%</span>
</div>

<div class="market-box">
<b>SOL</b>
<span class="green">+3.55%</span>
</div>

<div class="market-box">
<b>XRP</b>
<span class="red">-1.23%</span>
</div>

</section>



<section class="trade-card">

<div class="trade-head">

<div>

<h2>BTC/USDT</h2>

<div class="trend">
+3.94%
</div>

</div>

<div class="trade-price">

$70340.51

</div>

</div>



<div class="trade-info">

<span>L:67449.28</span>

<span>H:70585.99</span>

</div>



<div class="chart-box">

<div class="candles">

<span style="height:25%"></span>
<span style="height:40%"></span>
<span style="height:35%"></span>
<span style="height:50%"></span>
<span style="height:45%"></span>
<span style="height:62%"></span>
<span style="height:56%"></span>
<span style="height:70%"></span>
<span style="height:65%"></span>
<span style="height:82%"></span>
<span style="height:76%"></span>
<span style="height:92%"></span>

</div>

</div>



<h3 class="volume-title">

حجم التداول

</h3>

<div class="volume-bars">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>



<div class="momentum">

<span>

زخم السعر

</span>

<div class="line">

<div></div>

</div>

<p>

↑ صاعد

</p>

</div>

</section>
<!-- أزرار التداول -->

<section class="trade-actions">


<button class="new-trade">

+ صفقة جديدة

</button>



<button>

المفتوحة (0)

</button>



<button>

السجل

</button>


</section>






<!-- التحقق -->

<section class="verify-card">


<div class="verify-icon">

🛡️

</div>


<h3>

تفعيل التزامن

</h3>


<p>

قم بإكمال التحقق لتفعيل الصفقات المتقدمة

</p>


<button>

التحقق من الهوية

</button>


</section>







<!-- آخر الصفقات -->

<section class="orders-card">


<h3>

آخر الصفقات

</h3>



<div class="empty-order">

لا توجد صفقات حالياً

</div>


</section>







</div>






<script>


document.querySelectorAll(".market-box")
.forEach(function(item){


item.onclick=function(){


document.querySelectorAll(".market-box")
.forEach(function(x){

x.classList.remove("active");

});


this.classList.add("active");


}


});





document.querySelector(".new-trade")
.onclick=function(){


alert("تم فتح طلب صفقة جديدة");


};



</script>





</body>

</html>
