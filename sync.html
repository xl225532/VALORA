<!-- كود الصفقة -->


<section class="code-card">


<h2>

التزامن بالصفقة

</h2>



<p>

أدخل كود الصفقة للتحقق

</p>



<input

type="text"

id="tradeCode"

placeholder="كود الصفقة">



<button onclick="checkTrade()">

تحقق

</button>



<div id="result"></div>


</section>
<!-- آخر الصفقات -->


<section class="orders-card">


<h2>

آخر الصفقات

</h2>

<div class="empty-order">

لا توجد صفقات

</div>


</div>

<script>


// التحقق من كود الصفقة


function checkTrade(){


let code = document.getElementById("tradeCode").value;


let result = document.getElementById("result");



if(code.length >= 5){


result.innerHTML =

"✅ تم التحقق من الصفقة";


result.style.color="#22C55E";



saveTrade(code);



}else{


result.innerHTML =

"❌ كود الصفقة غير صحيح";


result.style.color="#EF4444";


}


}







// حفظ آخر الصفقات


function saveTrade(code){



let trades = JSON.parse(localStorage.getItem("trades")) || [];



let item = {


coin:"BTC/USDT",

code:code,

date:new Date().toLocaleString("ar-EG"),

status:"مكتملة"


};



trades.push(item);



localStorage.setItem(

"trades",

JSON.stringify(trades)

);



loadTrades();



}








// عرض الصفقات


function loadTrades(){



let box=document.getElementById("ordersList");



let trades = JSON.parse(localStorage.getItem("trades")) || [];




if(trades.length===0){


box.innerHTML=`

<div class="empty-order">

لا توجد صفقات

</div>

`;

return;

}




box.innerHTML="";



trades.reverse().forEach(function(item){



box.innerHTML += `


<div class="order-item">


<div>


<strong>

${item.coin}

</strong>


<br>


<span>

الكود: ${item.code}

</span>


</div>





<div>


<span>

${item.date}

</span>


<br>


<b class="green">

${item.status}

</b>


</div>



</div>


`;



});



}





loadTrades();



</script>
