<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | التحقق من الهوية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/verify.css">

<link rel="stylesheet" href="css/background.css">

</head>


<body>


<div class="verify-page">


<header class="page-header">

<a href="javascript:history.back()">
‹
</a>

<h2>
التحقق من الهوية
</h2>

</header>



<section class="verify-card">


<div class="verify-icon">

🪪

</div>


<h3>
تأكيد الهوية
</h3>


<p>
أكمل التحقق لحماية حسابك
</p>


</section>





<section class="rules-card">


<h3>
شروط التحقق
</h3>


<ul>

<li>
يجب أن تكون الوثيقة صادرة من جهة حكومية رسمية.
</li>

<li>
يقبل جواز السفر أو بطاقة الهوية.
</li>

<li>
يجب أن تكون الصورة واضحة.
</li>

<li>
يجب رفع صورة الوجه الحقيقية.
</li>

</ul>


</section>





<section class="upload-card">


<h4>
صورة الهوية أو جواز السفر
</h4>


<img id="idPreview" class="preview">



<label class="upload-box" id="idBox">


<input 
type="file"
accept="image/*"
capture="environment"
id="idInput">


<div>

📷

<br>

تصوير أو رفع الوثيقة

</div>


</label>



<button class="change-btn" id="idChange">

تغيير الصورة

</button>
<h4>
صورة الوجه
</h4>


<img id="facePreview" class="preview">



<label class="upload-box" id="faceBox">


<input 
type="file"
accept="image/*"
capture="user"
id="faceInput">


<div>

🤳

<br>

تصوير السيلفي

</div>


</label>



<button class="change-btn" id="faceChange">

إعادة التصوير

</button>





<button class="submit-btn">

إرسال للتحقق

</button>


</section>





<div id="bottomNav"></div>





<script src="js/language.js"></script>


<script>

if(typeof applyLanguage === "function"){

applyLanguage();

}
  function uploadImage(inputId, previewId, boxId, buttonId){


let input = document.getElementById(inputId);

let preview = document.getElementById(previewId);

let box = document.getElementById(boxId);

let button = document.getElementById(buttonId);



input.onchange = function(){


let file = this.files[0];


if(file){


preview.src = URL.createObjectURL(file);


preview.style.display = "block";


box.style.display = "none";


button.style.display = "block";


}


};



button.onclick = function(){


input.value = "";


preview.src = "";


preview.style.display = "none";


box.style.display = "flex";


button.style.display = "none";


};


}




uploadImage(
"idInput",
"idPreview",
"idBox",
"idChange"
);



uploadImage(
"faceInput",
"facePreview",
"faceBox",
"faceChange"
);





fetch("components/bottom-nav.html")

.then(response => response.text())

.then(data => {

document.getElementById("bottomNav").innerHTML = data;

})

.catch(error => {

console.log("Bottom Nav Error:", error);

});


</script>


</div>


</body>

</html>

إرسال للتحقق
