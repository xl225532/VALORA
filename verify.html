<!-- ==========================================
     LANGUAGE SYSTEM
========================================== -->

<script src="js/language.js"></script>


<script>


/* ==========================================
   LANGUAGE
========================================== */

if(typeof applyLanguage === "function"){

    applyLanguage();

}



/* ==========================================
   ELEMENTS
========================================== */

const idInput =
    document.getElementById("idInput");

const idPreview =
    document.getElementById("idPreview");

const idBox =
    document.getElementById("idBox");

const idChange =
    document.getElementById("idChange");


const faceInput =
    document.getElementById("faceInput");

const facePreview =
    document.getElementById("facePreview");

const faceBox =
    document.getElementById("faceBox");

const faceChange =
    document.getElementById("faceChange");


const submitButton =
    document.getElementById("submitVerification");



/* ==========================================
   ID IMAGE
========================================== */

function uploadImage(
    input,
    preview,
    box,
    changeButton
){

    if(!input){
        return;
    }


    input.addEventListener(
        "change",
        function(){

            const file =
                input.files &&
                input.files[0];


            if(!file){
                return;
            }


            if(!file.type.startsWith("image/")){

                alert(
                    typeof t === "function"
                        ? t("invalid_image")
                        : "يرجى اختيار صورة صحيحة"
                );

                input.value = "";

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    preview.src =
                        event.target.result;


                    preview.style.display =
                        "block";


                    if(box){

                        box.style.display =
                            "none";

                    }


                    if(changeButton){

                        changeButton.style.display =
                            "block";

                    }

                };


            reader.readAsDataURL(file);

        }
    );

}



/* ==========================================
   ID CHANGE
========================================== */

if(idChange){

    idChange.addEventListener(
        "click",
        function(){

            idInput.click();

        }
    );

}



/* ==========================================
   FACE CHANGE
========================================== */

if(faceChange){

    faceChange.addEventListener(
        "click",
        function(){

            faceInput.click();

        }
    );

}



/* ==========================================
   UPLOAD ID
========================================== */

uploadImage(
    idInput,
    idPreview,
    idBox,
    idChange
);



/* ==========================================
   UPLOAD FACE
========================================== */

uploadImage(
    faceInput,
    facePreview,
    faceBox,
    faceChange
);



/* ==========================================
   INITIAL STATE
========================================== */

if(idPreview){

    idPreview.style.display =
        "none";

}


if(facePreview){

    facePreview.style.display =
        "none";

}


if(idChange){

    idChange.style.display =
        "none";

}


if(faceChange){

    faceChange.style.display =
        "none";

}



/* ==========================================
   SUBMIT VERIFICATION
========================================== */

if(submitButton){

    submitButton.addEventListener(
        "click",
        function(){


            const idFile =
                idInput.files &&
                idInput.files[0];


            const faceFile =
                faceInput.files &&
                faceInput.files[0];



            /* ==============================
               ID REQUIRED
            ============================== */

            if(!idFile){

                alert(
                    typeof t === "function"
                        ? t("id_image_required")
                        : "يرجى رفع صورة الهوية أو جواز السفر"
                );

                return;

            }



            /* ==============================
               FACE REQUIRED
            ============================== */

            if(!faceFile){

                alert(
                    typeof t === "function"
                        ? t("face_image_required")
                        : "يرجى رفع صورة الوجه"
                );

                return;

            }



            /* ==============================
               SAVE STATUS
            ============================== */

            localStorage.setItem(
                "VALORA_VERIFICATION_STATUS",
                "pending"
            );



            /* ==============================
               SUCCESS
            ============================== */

            alert(
                typeof t === "function"
                    ? t("verification_submitted")
                    : "تم إرسال طلب التحقق بنجاح"
            );

        }
    );

}


</script>
