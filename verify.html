<body>



<div class="verify-page">





<header class="page-header">


<a href="settings.html">
‹
</a>


<h2>
التحقق من الهوية
</h2>


</header>








<section class="notice-card">


<div class="verify-icon">

🪪

</div>


<h3>
إكمال التحقق مطلوب
</h3>


<p>

لن تتمكن من تنفيذ عمليات السحب قبل تأكيد الهوية

</p>


</section>








<section class="upload-card">



<h3>

صورة الهوية الأمامية

</h3>



<label class="upload-box">


<input 
type="file"
id="idImage"
accept="image/*">



<span>

📷

<br>

رفع صورة الهوية

</span>



</label>






<h3>

صورة الوجه مع الهوية

</h3>



<label class="upload-box">


<input 
type="file"
id="faceImage"
accept="image/*">



<span>

🤳

<br>

رفع صورة الوجه

</span>



</label>







<button onclick="sendVerify()">

إرسال للتحقق

</button>



</section>

</div>







<script>


function sendVerify(){


let id =
document.getElementById("idImage").files.length;


let face =
document.getElementById("faceImage").files.length;




if(!id || !face){


alert("يرجى رفع صورة الهوية وصورة الوجه");

return;

}




localStorage.setItem(
"VALORA_VERIFY",
"pending"
);



alert("تم إرسال طلب التحقق");


}



</script>
