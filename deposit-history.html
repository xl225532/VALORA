<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | سجل الإيداعات</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/deposit-history.css">
<link rel="stylesheet" href="css/background.css">

</head>


<body>


<div class="history-page">



<header class="history-header">


<a href="wallet.html" class="back-btn">

‹

</a>


<h2>

سجل الإيداعات

</h2>


</header>




<section class="history-summary">


<div class="summary-card">


<span>

عدد الإيداعات

</span>


<strong id="totalDeposits">

0

</strong>


</div>





<div class="summary-card">


<span>

إجمالي الإيداعات

</span>


<strong id="totalDepositAmount">

0.00 USDT

</strong>


</div>


</section>





<section class="deposit-list" id="depositList">


</section>
<script>


function loadDepositHistory(){



let deposits =

JSON.parse(

localStorage.getItem("VALORA_DEPOSIT_HISTORY")

)

|| [];






let list =

document.getElementById("depositList");



let totalBox =

document.getElementById("totalDeposits");



let amountBox =

document.getElementById("totalDepositAmount");







list.innerHTML="";



let totalAmount = 0;







if(deposits.length === 0){



list.innerHTML = `

<div class="empty-history">

لا توجد إيداعات حتى الآن

</div>

`;



}







deposits.forEach((item)=>{



totalAmount +=

Number(item.amount);







let card =

document.createElement("div");





card.className="deposit-card";








card.innerHTML = `



<div class="deposit-top">


<strong>

${item.coin}

</strong>



<span class="success">

${item.status}

</span>


</div>







<div class="deposit-info">


<p>

الشبكة:

<b>

${item.network}

</b>

</p>





<p>

المبلغ:

<b>

${Number(item.amount).toFixed(2)}

${item.coin}

</b>

</p>






<p>

تاريخ الإيداع:

<b>

${item.date}

</b>

</p>



</div>


`;








list.appendChild(card);



});








totalBox.innerHTML =

deposits.length;







amountBox.innerHTML =

totalAmount.toFixed(2)

+

" USDT";



}







document.addEventListener(

"DOMContentLoaded",

loadDepositHistory

);



</script>






</div>


</body>


</html>
