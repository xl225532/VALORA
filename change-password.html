<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | تغيير كلمة المرور</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/change-password.css">

</head>


<body>


<div class="password-page">



<header class="page-header">

<a href="settings.html">
‹
</a>

<h2>
تغيير كلمة المرور
</h2>

</header>





<section class="password-card">


<div class="icon">
🔑
</div>


<h3>
تغيير كلمة المرور
</h3>


<p>
سيتم إرسال رمز تحقق حسب البريد الإلكتروني أو رقم الهاتف المسجل
</p>


</section>







<section class="form-card">


<label>
طريقة إرسال الرمز
</label>


<div class="method-box">


<button type="button" onclick="sendCode('email')">
📧 البريد الإلكتروني
</button>



<button type="button" onclick="sendCode('phone')">
📱 رقم الهاتف
</button>


</div>






<label>
رمز التحقق
</label>


<input 
type="text"
id="verifyCode"
placeholder="أدخل رمز التحقق">






<label>
كلمة المرور الجديدة
</label>


<input
type="password"
id="newPassword"
placeholder="********">






<label>
تأكيد كلمة المرور
</label>


<input
type="password"
id="confirmPassword"
placeholder="********">






<button class="save-btn" onclick="savePassword()">

حفظ التغيير

</button>



</section>






<!-- الشريط الجديد -->

<div id="bottomNav"></div>







<script>


let sendMethod = "";



function sendCode(type){


sendMethod = type;


if(type === "email"){

alert("تم إرسال رمز التحقق إلى البريد الإلكتروني");

}

else{

alert("تم إرسال رمز التحقق إلى رقم الهاتف");

}


}





function savePassword(){


let code =
document.getElementById("verifyCode").value;


let pass =
document.getElementById("newPassword").value;


let confirm =
document.getElementById("confirmPassword").value;




if(sendMethod === ""){

alert("اختر طريقة إرسال الرمز");

return;

}



if(code === "" || pass === ""){

alert("أكمل جميع البيانات");

return;

}



if(pass !== confirm){

alert("كلمة المرور غير متطابقة");

return;

}



localStorage.setItem(
"VALORA_PASSWORD",
pass
);



alert("تم تغيير كلمة المرور بنجاح");


window.location.href="settings.html";


}






// تحميل الشريط الجديد

fetch("components/bottom-nav.html")

.then(response => response.text())

.then(data => {

document.getElementById("bottomNav").innerHTML = data;

});



</script>



</div>


</body>

</html>
