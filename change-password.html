<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | تغيير كلمة المرور</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/change-password.css">

</head>



<body class="change-page">



<div class="change-container">





<header class="change-header">


<a href="dashboard.html">
‹
</a>


<h2>
تغيير كلمة المرور
</h2>


</header>







<div class="change-card">



<div class="change-icon">

🔑

</div>




<h3>
تحديث كلمة المرور
</h3>



<p>
سيتم إرسال رمز تحقق حسب طريقة التسجيل
</p>








<div class="method-box">


<label>
طريقة إرسال الرمز
</label>



<div id="sendMethod">

جاري التحقق...

</div>



</div>







<button class="send-code" onclick="sendCode()">

إرسال رمز التحقق

</button>







<div class="input-box">


<label>
رمز التحقق
</label>


<input 
id="verifyCode"
type="number"
placeholder="أدخل الرمز">

</div>







<div class="input-box">


<label>
كلمة المرور الجديدة
</label>


<input 
id="newPassword"
type="password"
placeholder="كلمة المرور الجديدة">

</div>






<div class="input-box">


<label>
تأكيد كلمة المرور
</label>


<input 
id="confirmPassword"
type="password"
placeholder="تأكيد كلمة المرور">


</div>





<button class="save-button" onclick="changePassword()">

حفظ كلمة المرور

</button>






<div id="successBox" class="change-message success">

✓ تم تغيير كلمة المرور بنجاح

</div>





<div id="errorBox" class="change-message error">

× رمز التحقق غير صحيح

</div>







</div>

</div>








<script>





let user = JSON.parse(

localStorage.getItem("VALORA_USER")

);





let sentCode="";






// تحديد طريقة التسجيل


if(user){



let contact=user.contact;



if(contact.includes("@")){


document.getElementById("sendMethod").innerHTML =

"📧 سيتم إرسال الرمز إلى البريد الإلكتروني";


}

else{


document.getElementById("sendMethod").innerHTML =

"📱 سيتم إرسال الرمز إلى رقم الهاتف";


}



}









function sendCode(){



// للتجربة فقط

sentCode = Math.floor(100000 + Math.random()*900000);





alert(

"رمز التحقق للتجربة: "+sentCode

);



}









function changePassword(){



let code =
document.getElementById("verifyCode").value;



let password =
document.getElementById("newPassword").value;



let confirm =
document.getElementById("confirmPassword").value;






document.getElementById("successBox").style.display="none";

document.getElementById("errorBox").style.display="none";







if(code != sentCode){



document.getElementById("errorBox").innerHTML =

"× رمز التحقق غير صحيح";


document.getElementById("errorBox").style.display="block";


return;


}






if(password==="" || password!==confirm){


document.getElementById("errorBox").innerHTML =

"× تأكد من كلمة المرور";


document.getElementById("errorBox").style.display="block";


return;


}








if(user){



user.password=password;



localStorage.setItem(

"VALORA_USER",

JSON.stringify(user)

);



}







document.getElementById("successBox").style.display="block";



}



</script>





</body>

</html>
