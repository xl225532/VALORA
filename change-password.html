<style>

/* ==========================================
   ERROR MESSAGE
========================================== */

.password-error{

    display:none;

    width:100%;

    margin-top:14px;

    padding:12px 14px;

    background:rgba(255,59,59,.08);

    border:1px solid #ff3b3b;

    border-radius:12px;

    color:#ff5c5c;

    font-size:13px;

    line-height:1.7;

    text-align:center;

}


/* ==========================================
   ERROR INPUT
========================================== */

.password-input-error{

    border:1px solid #ff3b3b !important;

    box-shadow:
        0 0 0 2px rgba(255,59,59,.08);

}


/* ==========================================
   ERROR METHOD BUTTON
========================================== */

.method-error{

    border:1px solid #ff3b3b !important;

    box-shadow:
        0 0 0 2px rgba(255,59,59,.08);

}


/* ==========================================
   METHOD BOX
========================================== */

.method-box{

    transition:.2s ease;

}


/* ==========================================
   PASSWORD HINT
========================================== */

.password-hint{

    margin-top:8px;

    color:#98A5B8;

    font-size:12px;

    line-height:1.6;

}

</style>

<!-- ==========================================
     INFORMATION CARD

🔑

تغيير كلمة المرور

<p data-lang="change_password_description">

سيتم إرسال رمز تحقق حسب البريد الإلكتروني أو رقم الهاتف المسجل

     FORM
========================================== -->

</label>

type="button"
onclick="sendCode('email')"
id="emailMethod"
>

📧

<span data-lang="change_password_email">

البريد الإلكتروني

</span>

</button>

type="button"
onclick="sendCode('phone')"
id="phoneMethod"
>

📱

رقم الهاتف

</span>

</button>


</div>




<!-- VERIFICATION CODE -->

<label data-lang="verification_code">

رمز التحقق

</label>



<input

type="text"

id="verifyCode"

inputmode="numeric"

autocomplete="off"

maxlength="6"

data-lang-placeholder="change_password_code_placeholder"

placeholder="أدخل رمز التحقق"

>




<!-- NEW PASSWORD -->

<label data-lang="new_password">

كلمة المرور الجديدة

</label>



<input

type="password"

id="newPassword"

autocomplete="new-password"

data-lang-placeholder="new_password_placeholder"

placeholder="********"

>


<div class="password-hint" data-lang="password_hint">

يجب أن تكون كلمة المرور 6 أحرف على الأقل

</div>




<!-- CONFIRM PASSWORD -->

<label data-lang="confirm_password">

تأكيد كلمة المرور

</label>



<input

type="password"

id="confirmPassword"

autocomplete="new-password"

data-lang-placeholder="confirm_password_placeholder"

placeholder="********"

>




<!-- ERROR -->

<div
id="passwordError"
class="password-error">
</div>




<!-- SAVE -->

<button
type="button"
class="save-btn"
onclick="savePassword()"
data-lang="save_password_change"
>

حفظ التغيير

</button>

<!-- ==========================================
     LANGUAGE SYSTEM
========================================== -->

<script src="js/language.js"></script>


<script>


/* ==========================================
   LANGUAGE
========================================== */

if(typeof applyLanguage === "function"){

    applyLanguage();

}




/* ==========================================
   SEND METHOD
========================================== */

let sendMethod = "";




/* ==========================================
   GET TRANSLATION
========================================== */

function translate(key, fallback){

    if(typeof t === "function"){

        const result = t(key);

        if(result && result !== key){

            return result;

        }

    }

    return fallback;

}




/* ==========================================
   CLEAR ERROR
========================================== */

function clearPasswordError(){


    const error =
        document.getElementById(
            "passwordError"
        );


    const code =
        document.getElementById(
            "verifyCode"
        );


    const password =
        document.getElementById(
            "newPassword"
        );


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        );


    const methodBox =
        document.getElementById(
            "methodBox"
        );



    error.style.display =
        "none";


    error.textContent =
        "";



    code.classList.remove(
        "password-input-error"
    );


    password.classList.remove(
        "password-input-error"
    );


    confirmPassword.classList.remove(
        "password-input-error"
    );


    methodBox.classList.remove(
        "method-error"
    );

}




/* ==========================================
   SHOW ERROR
========================================== */

function showPasswordError(
    message,
    input
){


    const error =
        document.getElementById(
            "passwordError"
        );



    clearPasswordError();



    error.textContent =
        message;



    error.style.display =
        "block";



    if(input){

        input.classList.add(
            "password-input-error"
        );


        input.focus();

    }

}




/* ==========================================
   SEND VERIFICATION CODE
========================================== */

function sendCode(type){


    clearPasswordError();


    sendMethod =
        type;



    const methodBox =
        document.getElementById(
            "methodBox"
        );


    methodBox.classList.remove(
        "method-error"
    );



    if(type === "email"){


        alert(

            translate(

                "verification_sent_email",

                "تم إرسال رمز التحقق إلى البريد الإلكتروني"

            )

        );


    }else{


        alert(

            translate(

                "verification_sent_phone",

                "تم إرسال رمز التحقق إلى رقم الهاتف"

            )

        );


    }

}




/* ==========================================
   SAVE PASSWORD
========================================== */

function savePassword(){


    const code =
        document.getElementById(
            "verifyCode"
        );


    const password =
        document.getElementById(
            "newPassword"
        );


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        );


    const methodBox =
        document.getElementById(
            "methodBox"
        );



    const codeValue =
        code.value.trim();


    const passwordValue =
        password.value;


    const confirmValue =
        confirmPassword.value;



    /*
    ==========================================
    CLEAR OLD ERROR
    ==========================================
    */

    clearPasswordError();




    /*
    ==========================================
    METHOD REQUIRED
    ==========================================
    */

    if(sendMethod === ""){


        const error =
            document.getElementById(
                "passwordError"
            );


        error.textContent =
            translate(

                "change_password_method_error",

                "اختر طريقة إرسال الرمز أولاً"

            );


        error.style.display =
            "block";


        methodBox.classList.add(
            "method-error"
        );


        return;

    }




    /*
    ==========================================
    VERIFICATION CODE REQUIRED
    ==========================================
    */

    if(codeValue === ""){


        showPasswordError(

            translate(

                "change_password_code_error",

                "أدخل رمز التحقق"

            ),

            code

        );


        return;

    }




    /*
    ==========================================
    VERIFICATION CODE LENGTH
    ==========================================
    */

    if(

        codeValue.length !== 6 ||

        !/^[0-9]+$/.test(codeValue)

    ){


        showPasswordError(

            translate(

                "change_password_code_invalid",

                "رمز التحقق يجب أن يتكون من 6 أرقام"

            ),

            code

        );


        return;

    }




    /*
    ==========================================
    PASSWORD REQUIRED
    ==========================================
    */

    if(passwordValue === ""){


        showPasswordError(

            translate(

                "new_password_error",

                "أدخل كلمة المرور الجديدة"

            ),

            password

        );


        return;

    }




    /*
    ==========================================
    PASSWORD LENGTH
    ==========================================
    */

    if(passwordValue.length < 6){


        showPasswordError(

            translate(

                "new_password_length_error",

                "يجب أن تكون كلمة المرور 6 أحرف على الأقل"

            ),

            password

        );


        return;

    }




    /*
    ==========================================
    CONFIRM PASSWORD
    ==========================================
    */

    if(confirmValue === ""){


        showPasswordError(

            translate(

                "confirm_password_error",

                "أعد إدخال كلمة المرور"

            ),

            confirmPassword

        );


        return;

    }




    /*
    ==========================================
    PASSWORD MATCH
    ==========================================
    */

    if(passwordValue !== confirmValue){


        showPasswordError(

            translate(

                "password_mismatch",

                "كلمة المرور غير متطابقة"

            ),

            confirmPassword

        );


        return;

    }




    /*
    ==========================================
    SAVE PASSWORD
    ==========================================
    */

    localStorage.setItem(

        "VALORA_PASSWORD",

        passwordValue

    );




    /*
    ==========================================
    SUCCESS
    ==========================================
    */

    alert(

        translate(

            "password_changed_success",

            "تم تغيير كلمة المرور بنجاح"

        )

    );



    clearPasswordError();



    window.location.href =
        "settings.html";

}




/* ==========================================
   REMOVE RED BORDER WHILE TYPING
========================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){


        const inputs =
            document.querySelectorAll(
                "#verifyCode, #newPassword, #confirmPassword"
            );



        inputs.forEach(
            function(input){

                input.addEventListener(
                    "input",
                    function(){

                        input.classList.remove(
                            "password-input-error"
                        );

                    }
                );

            }
        );

    }
);

</script>


</div>


</body>
