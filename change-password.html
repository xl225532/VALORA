<!-- ==========================================
     PASSWORD SYSTEM
========================================== -->

<script>

let sendMethod = "";



function sendCode(type){

    sendMethod = type;


    if(type === "email"){

        alert(
            typeof t === "function"
                ? t("verification_sent_email")
                : "تم إرسال رمز التحقق إلى البريد الإلكتروني"
        );

    }

    else{

        alert(
            typeof t === "function"
                ? t("verification_sent_phone")
                : "تم إرسال رمز التحقق إلى رقم الهاتف"
        );

    }

}



function savePassword(){


    const code =
        document.getElementById("verifyCode").value.trim();


    const pass =
        document.getElementById("newPassword").value;


    const confirm =
        document.getElementById("confirmPassword").value;



    /* ======================================
       METHOD REQUIRED
    ====================================== */

    if(sendMethod === ""){

        alert(
            typeof t === "function"
                ? t("verification_method_required")
                : "اختر طريقة إرسال الرمز"
        );

        return;

    }



    /* ======================================
       CODE REQUIRED
    ====================================== */

    if(code === ""){

        alert(
            typeof t === "function"
                ? t("verification_code_required")
                : "يرجى إدخال رمز التحقق"
        );

        return;

    }



    /* ======================================
       PASSWORD REQUIRED
    ====================================== */

    if(pass === ""){

        alert(
            typeof t === "function"
                ? t("new_password_required")
                : "يرجى إدخال كلمة المرور الجديدة"
        );

        return;

    }



    /* ======================================
       PASSWORD LENGTH
    ====================================== */

    if(pass.length < 6){

        alert(
            typeof t === "function"
                ? t("new_password_too_short")
                : "يجب أن تكون كلمة المرور 6 أحرف على الأقل"
        );

        return;

    }



    /* ======================================
       CONFIRM PASSWORD
    ====================================== */

    if(confirm === ""){

        alert(
            typeof t === "function"
                ? t("confirm_password_required")
                : "يرجى تأكيد كلمة المرور"
        );

        return;

    }



    /* ======================================
       PASSWORD MATCH
    ====================================== */

    if(pass !== confirm){

        alert(
            typeof t === "function"
                ? t("password_mismatch")
                : "كلمة المرور غير متطابقة"
        );

        return;

    }



    /* ======================================
       SAVE
    ====================================== */

    localStorage.setItem(
        "VALORA_PASSWORD",
        pass
    );



    /* ======================================
       SUCCESS
    ====================================== */

    alert(
        typeof t === "function"
            ? t("password_changed_success")
            : "تم تغيير كلمة المرور بنجاح"
    );


    window.location.href =
        "settings.html";

}

</script>
