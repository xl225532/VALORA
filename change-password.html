</label>

type="password"
id="newPassword"
placeholder="********">

تأكيد كلمة المرور
</label>

type="password"
id="confirmPassword"
placeholder="********">

</button>

<script>


let sendMethod = "";





function sendCode(type){


sendMethod = type;



if(type === "email"){


alert("تم إرسال رمز التحقق إلى البريد الإلكتروني");


}

else{


alert("تم إرسال رمز التحقق إلى رقم الهاتف");


}


}








function savePassword(){



let code =
document.getElementById("verifyCode").value;



let pass =
document.getElementById("newPassword").value;



let confirm =
document.getElementById("confirmPassword").value;






if(sendMethod === ""){


alert("اختر طريقة إرسال الرمز");


return;


}







if(code === "" || pass === ""){


alert("أكمل جميع البيانات");


return;


}







if(pass !== confirm){


alert("كلمة المرور غير متطابقة");


return;


}







localStorage.setItem(

"VALORA_PASSWORD",

pass

);






alert("تم تغيير كلمة المرور بنجاح");



window.location.href="settings.html";


}



</script>
