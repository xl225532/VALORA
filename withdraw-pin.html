<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | رمز أمان السحب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/pin.css">
<link rel="stylesheet" href="css/background.css">

</head>


<body>


<div class="pin-page">



<header class="page-header">

<a href="settings.html">

‹

</a>


<h2 data-lang="withdraw_security_title">

رمز أمان السحب

</h2>


</header>







<section class="pin-card">


<div class="pin-icon">

🛡️

</div>


<h3 data-lang="withdraw_security_protect">

حماية عمليات السحب

</h3>


<p data-lang="withdraw_security_description">

يُستخدم هذا الرمز عند تنفيذ أي عملية سحب من الحساب

</p>


</section>








<section class="form-card">


<label data-lang="current_security_pin">

رمز أمان السحب الحالي

</label>


<input 
type="password"
id="currentSecurity"
maxlength="6"
inputmode="numeric"
data-lang-placeholder="current_security_placeholder"
placeholder="أدخل الرمز الحالي">


<div class="field-error" id="currentSecurityError"></div>





<label data-lang="new_security_pin">

رمز أمان جديد

</label>


<input 
type="password"
id="newSecurity"
maxlength="6"
inputmode="numeric"
data-lang-placeholder="new_security_placeholder"
placeholder="أدخل الرمز الجديد">


<div class="field-error" id="newSecurityError"></div>






<label data-lang="confirm_security_pin">

تأكيد الرمز الجديد

</label>


<input 
type="password"
id="confirmSecurity"
maxlength="6"
inputmode="numeric"
data-lang-placeholder="confirm_security_placeholder"
placeholder="أعد إدخال الرمز الجديد">


<div class="field-error" id="confirmSecurityError"></div>





<button onclick="saveSecurity()" data-lang="save_security_pin">

حفظ الرمز

</button>



</section>







</div>



<script src="js/language.js"></script>


<script>


if(typeof applyLanguage === "function"){

    applyLanguage();

}




function saveSecurity(){


let current =
document.getElementById("currentSecurity").value.trim();


let code =
document.getElementById("newSecurity").value.trim();


let confirm =
document.getElementById("confirmSecurity").value.trim();



let currentError =
document.getElementById("currentSecurityError");


let codeError =
document.getElementById("newSecurityError");


let confirmError =
document.getElementById("confirmSecurityError");



currentError.textContent="";
codeError.textContent="";
confirmError.textContent="";


document.querySelectorAll("input").forEach(function(input){

    input.classList.remove("error");

});



let lang =
typeof getLanguage === "function"
? getLanguage()
: "ar";



let text = {


ar:{


required:
"أدخل رمز الأمان",

length:
"يجب أن يتكون الرمز من 6 أرقام",

match:
"الرمز غير متطابق",

wrong:
"رمز الأمان الحالي غير صحيح",

success:
"تم حفظ رمز الأمان بنجاح"


},


en:{


required:
"Enter security code",

length:
"The code must contain 6 digits",

match:
"The security codes do not match",

wrong:
"The current security code is incorrect",

success:
"Security code saved successfully"


}


};



let t=text[lang] || text.ar;



let saved =
localStorage.getItem("VALORA_SECURITY_PIN");



if(saved && current !== saved){


currentError.textContent=t.wrong;

document.getElementById("currentSecurity")
.classList.add("error");

return;

}





if(!code){


codeError.textContent=t.required;

document.getElementById("newSecurity")
.classList.add("error");

return;

}





if(!/^\d{6}$/.test(code)){


codeError.textContent=t.length;

document.getElementById("newSecurity")
.classList.add("error");

return;

}





if(!confirm){


confirmError.textContent=t.required;

document.getElementById("confirmSecurity")
.classList.add("error");

return;

}





if(code !== confirm){


confirmError.textContent=t.match;

document.getElementById("confirmSecurity")
.classList.add("error");

return;

}





localStorage.setItem(
"VALORA_SECURITY_PIN",
code
);



alert(t.success);


window.location.href="settings.html";


}



</script>


</body>

</html>
