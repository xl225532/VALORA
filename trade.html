<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | تداول</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/trade.css">
<link rel="stylesheet" href="css/background.css">

</head>


<body>


<div class="trade-page">



<header class="trade-header">


<button onclick="history.back()" class="back">

←

</button>




<div class="coin-header">


<div class="coin-big btc">

₿

</div>


<div>


<h2>

Bitcoin

</h2>


<span>

BTC / USDT

</span>


</div>


</div>


</header>








<section class="price-box">


<p>

السعر الحالي

</p>


<h1 id="tradePrice">

67,500$

</h1>


<span class="up">

▲ 2.45%

</span>


</section>








<section class="chart-box">


<div class="chart-line">


<span></span>

<span></span>

<span></span>

<span></span>

<span></span>


</div>


</section>








<section class="trade-form">



<div class="available">


الرصيد المتاح


<strong id="tradeBalance">

0.00 USDT

</strong>



</div>






<label>

الكمية

</label>


<input

type="number"

id="tradeAmount"

placeholder="أدخل مبلغ التداول بالـ USDT"

>





<div class="buttons">


<button class="buy" onclick="buyTrade()">

شراء

</button>




<button class="sell" onclick="sellTrade()">

بيع

</button>



</div>




</section>
<section class="orders">


<h3>

آخر العمليات

</h3>




<div id="tradeHistory" class="trade-history">


<div class="empty">

لا توجد عمليات

</div>



</div>



</section>






</div>






<script src="js/trade.js"></script>




</body>

</html>
