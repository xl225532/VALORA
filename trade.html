<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>VALORA | Trade</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="css/trade.css">

</head>


<body>


<div class="trade-page">


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="trade-header">

        <button
            class="back-btn"
            onclick="history.back()"
            aria-label="Back">

            ‹

        </button>


        <div class="trade-title">

            <h1 id="coinName">
                Bitcoin
            </h1>

            <span id="coinPair">
                BTC / USDT
            </span>

        </div>

    </header>



    <!-- ==========================================
         MAIN
    =========================================== -->

    <main>


        <!-- ======================================
             PRICE
        ======================================= -->

        <section class="price-card">


            <div
                class="price-label"
                data-lang="current_price">

                السعر الحالي

            </div>


            <div
                id="coinPrice"
                class="price-value">

                --

            </div>


            <div
                id="coinChange"
                class="price-change">

                --

            </div>


        </section>



        <!-- ======================================
             BUY / SELL
        ======================================= -->

        <section class="trade-actions">


            <button
                class="trade-btn buy-btn"
                type="button"
                onclick="selectTradeType('buy')"
                data-lang="buy">

                شراء

            </button>


            <button
                class="trade-btn sell-btn"
                type="button"
                onclick="selectTradeType('sell')"
                data-lang="sell">

                بيع

            </button>


        </section>



        <!-- ======================================
             TRADE FORM
        ======================================= -->

        <section class="trade-form">


            <!-- AVAILABLE BALANCE -->

            <div class="field-group">


                <label
                    data-lang="available_balance">

                    الرصيد المتاح

                </label>


                <strong id="availableBalance">

                    0 USDT

                </strong>


            </div>



            <!-- AMOUNT -->

            <div class="field-group">


                <label
                    for="tradeAmount"
                    data-lang="amount">

                    الكمية

                </label>


                <input
                    id="tradeAmount"
                    type="number"
                    min="0"
                    step="any"
                    data-lang-placeholder="enter_amount"
                    placeholder="أدخل مبلغ التداول بالـ USDT">


            </div>



            <!-- SUBMIT -->

            <button
                id="submitTrade"
                class="submit-trade"
                type="button"
                onclick="submitTrade()">

                <span data-lang="buy">

                    شراء

                </span>

            </button>


        </section>



        <!-- ======================================
             RECENT ORDERS
        ======================================= -->

        <section class="orders-section">


            <h2 data-lang="recent_orders">

                آخر العمليات

            </h2>


            <div
                id="ordersList"
                class="orders-list">


                <div
                    class="empty-orders"
                    data-lang="no_orders">

                    لا توجد عمليات

                </div>


            </div>


        </section>


    </main>


</div>



<!-- ==========================================
     LANGUAGE SYSTEM
=========================================== -->

<script src="js/language.js"></script>


<!-- ==========================================
     TRADE SYSTEM
=========================================== -->

<script src="js/trade.js"></script>


</body>

</html>
