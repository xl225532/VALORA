<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>VALORA | تداول</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet">


<link rel="stylesheet"
      href="css/trade.css">

<link rel="stylesheet"
      href="css/background.css">

</head>


<body>


<div class="trade-page">


<!-- ==========================================
     HEADER
=========================================== -->

<header class="trade-header">


<button
    onclick="history.back()"
    class="back">

←

</button>



<div class="coin-header">


<div
    class="coin-big btc"
    id="coinIcon">

₿

</div>



<div>


<h2 id="coinName">

Bitcoin

</h2>


<span id="coinPair">

BTC / USDT

</span>


</div>


</div>


</header>





<!-- ==========================================
     PRICE
=========================================== -->

<section class="price-box">


<p data-lang="current_price">

السعر الحالي

</p>


<h1 id="tradePrice">

67,500$

</h1>


<span
    class="up"
    id="tradeChange">

▲ 2.45%

</span>


</section>





<!-- ==========================================
     CHART
=========================================== -->

<section class="chart-box">


<div class="chart-line">


<span></span>

<span></span>

<span></span>

<span></span>

<span></span>


</div>


</section>





<!-- ==========================================
     TRADE FORM
=========================================== -->

<section class="trade-form">



<div class="available">


<span data-lang="available_balance">

الرصيد المتاح

</span>


<strong id="tradeBalance">

0.00 USDT

</strong>



</div>





<label
    for="tradeAmount"
    data-lang="amount">

الكمية

</label>


<input

type="number"

id="tradeAmount"

data-lang-placeholder="enter_amount"

placeholder="أدخل مبلغ التداول بالـ USDT"

min="0"

step="any"

>





<div class="buttons">


<button
    class="buy"
    id="buyButton"
    onclick="buyTrade()"
    data-lang="buy">

شراء

</button>




<button
    class="sell"
    id="sellButton"
    onclick="sellTrade()"
    data-lang="sell">

بيع

</button>



</div>




</section>





<!-- ==========================================
     ORDERS
=========================================== -->

<section class="orders">


<h3 data-lang="recent_orders">

آخر العمليات

</h3>




<div
    id="tradeHistory"
    class="trade-history">


<div
    class="empty"
    data-lang="no_orders">

لا توجد عمليات

</div>



</div>


</section>





</div>





<!-- ==========================================
     LANGUAGE
=========================================== -->

<script src="js/language.js"></script>


<!-- ==========================================
     TRADE
=========================================== -->

<script src="js/trade.js"></script>


</body>

</html>
