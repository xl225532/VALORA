<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | رمز أمان السحب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/security.css">

</head>


<body>


<div class="security-page">



<header class="page-header">


<a href="settings.html">
‹
</a>


<h2>
رمز أمان السحب
</h2>


</header>







<section class="security-card">


<div class="icon">

🔐

</div>



<h3>
إنشاء رمز أمان للسحب
</h3>



<p>

يستخدم هذا الرمز لحماية عمليات السحب من الحساب

</p>



</section>







<div class="form-card">



<label>

رمز الأمان

</label>


<input

type="password"

id="securityCode"

maxlength="6"

placeholder="أدخل رمز من 6 أرقام">






<label>

تأكيد رمز الأمان

</label>


<input

type="password"

id="confirmCode"

maxlength="6"

placeholder="أعد إدخال الرمز">






<button onclick="saveSecurity()">

حفظ الرمز

</button>



</div>







<nav class="bottom-nav">

</a>


</nav>







</div>







<script>


function saveSecurity(){


let code =
document.getElementById("securityCode").value;


let confirm =
document.getElementById("confirmCode").value;



if(code.length !== 6){

alert("أدخل رمز من 6 أرقام");

return;

}



if(code !== confirm){

alert("الرمز غير متطابق");

return;

}



localStorage.setItem(
"VALORA_SECURITY",
code
);



alert("تم حفظ رمز الأمان");


}




</script>




</body>

</html>
