    line-height:1.7;

/* ==========================================
   ERROR INPUT
========================================== */

    box-shadow:
        0 0 0 2px rgba(255,59,59,.08);

}


/* ==========================================

========================================== */

<!-- ==========================================
     LANGUAGE SYSTEM
========================================== -->

<script src="js/language.js"></script>


<script>


/* ==========================================
   APPLY LANGUAGE
========================================== */

if(typeof applyLanguage === "function"){

    applyLanguage();

}




/* ==========================================
   CLEAR ERROR
========================================== */

function clearSecurityError(){


    const error =
        document.getElementById(
            "securityError"
        );


    const code =
        document.getElementById(
            "securityCode"
        );


    const confirmCode =
        document.getElementById(
            "confirmCode"
        );



    error.style.display =
        "none";


    error.textContent =
        "";



    code.classList.remove(
        "security-input-error"
    );


    confirmCode.classList.remove(
        "security-input-error"
    );

}




/* ==========================================
   SHOW ERROR
========================================== */

function showSecurityError(
    message,
    input
){


    const error =
        document.getElementById(
            "securityError"
        );



    clearSecurityError();



    error.textContent =
        message;



    error.style.display =
        "block";



    if(input){

        input.classList.add(
            "security-input-error"
        );


        input.focus();

    }

}




/* ==========================================
   SAVE SECURITY CODE
========================================== */

function saveSecurity(){


    const code =
        document.getElementById(
            "securityCode"
        );


    const confirmCode =
        document.getElementById(
            "confirmCode"
        );



    const codeValue =
        code.value.trim();


    const confirmValue =
        confirmCode.value.trim();



    /*
    ==========================================
    CLEAR PREVIOUS ERROR
    ==========================================
    */

    clearSecurityError();




    /*
    ==========================================
    CHECK SECURITY CODE
    ==========================================
    */

    if(

        codeValue === "" ||

        codeValue.length !== 6 ||

        !/^[0-9]+$/.test(codeValue)

    ){


        showSecurityError(

            typeof t === "function"

                ? t(
                    "security_enter_error"
                  )

                : "أدخل رمز من 6 أرقام",

            code

        );


        return;

    }




    /*
    ==========================================
    CHECK CONFIRM CODE
    ==========================================
    */

    if(

        confirmValue === "" ||

        confirmValue !== codeValue

    ){


        showSecurityError(

            typeof t === "function"

                ? t(
                    "security_match_error"
                  )

                : "الرمز غير متطابق",

            confirmCode

        );


        return;

    }




    /*
    ==========================================
    SAVE
    ==========================================
    */

    localStorage.setItem(

        "VALORA_SECURITY",

        codeValue

    );




    /*
    ==========================================
    SUCCESS
    ==========================================
    */

    alert(

        typeof t === "function"

            ? t(
                "security_saved"
              )

            : "تم حفظ رمز الأمان بنجاح"

    );



    clearSecurityError();

}




/* ==========================================
   REMOVE ERROR WHILE TYPING
========================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const code =
            document.getElementById(
                "securityCode"
            );


        const confirmCode =
            document.getElementById(
                "confirmCode"
            );



        if(code){

            code.addEventListener(
                "input",
                function(){

                    code.classList.remove(
                        "security-input-error"
                    );

                }
            );

        }



        if(confirmCode){

            confirmCode.addEventListener(
                "input",
                function(){

                    confirmCode.classList.remove(
                        "security-input-error"
                    );

                }
            );

        }

    }
);

</script>

</body>
