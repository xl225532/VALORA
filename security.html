<script>


function saveSecurity(){


let code =
document.getElementById("securityCode").value;


let confirm =
document.getElementById("confirmCode").value;



if(code.length !== 6){

alert("أدخل رمز من 6 أرقام");

return;

}



if(code !== confirm){

alert("الرمز غير متطابق");

return;

}



localStorage.setItem(
"VALORA_SECURITY",
code
);



alert("تم حفظ رمز الأمان");


}



</script>
