<script src="js/language.js"></script>


<script>


if(typeof applyLanguage === "function"){

    applyLanguage();

}





function saveSecurity(){



let code =

document.getElementById("securityCode").value.trim();



let confirmCode =

document.getElementById("confirmCode").value.trim();






if(
code === "" ||
confirmCode === "" ||
code.length !== 6 ||
!/^[0-9]+$/.test(code)

){


alert(

typeof t === "function"

?

t("security_enter_error")

:

"أدخل رمز من 6 أرقام"

);


return;

}







if(code !== confirmCode){


alert(

typeof t === "function"

?

t("security_match_error")

:

"الرمز غير متطابق"

);


return;


}







localStorage.setItem(

"VALORA_SECURITY",

code

);






alert(

typeof t === "function"

?

t("security_saved")

:

"تم حفظ رمز الأمان بنجاح"

);




}



</script>
