<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | سجل السحوبات</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/withdraw-history.css">
<link rel="stylesheet" href="css/background.css">

</head>


<body>


<div class="history-page">


<!-- ==========================================
     HEADER
========================================== -->

<header class="history-header">


<a href="wallet.html" class="back-btn">

‹

</a>


<h2 data-lang="withdraw_history_title">

سجل السحوبات

</h2>


</header>




<!-- ==========================================
     SUMMARY
========================================== -->


<section class="history-summary">


<div class="summary-card">


<span data-lang="total_requests">

إجمالي الطلبات

</span>


<strong id="totalWithdrawals">

0

</strong>


</div>





<div class="summary-card">


<span data-lang="total_amounts">

إجمالي المبالغ

</span>


<strong id="totalAmount">

0.00 USDT

</strong>


</div>


</section>





<!-- ==========================================
     WITHDRAW LIST
========================================== -->


<section 
class="withdraw-list"
id="withdrawList">


</section>



</div>





<!-- ==========================================
     LANGUAGE SYSTEM
========================================== -->


<script src="js/language.js"></script>



<script>


// ==========================================
// GET LANGUAGE
// ==========================================


function getWithdrawLanguage(){


    if(typeof getLanguage === "function"){

        return getLanguage();

    }


    return localStorage.getItem("VALORA_LANG") || "ar";


}







// ==========================================
// STATUS TRANSLATION
// ==========================================


function translateWithdrawStatus(status, lang){


    if(lang === "en"){


        if(
            status === "pending" ||
            status === "قيد المعالجة"
        ){

            return "Processing";

        }


        if(
            status === "completed" ||
            status === "مكتمل" ||
            status === "ناجح"
        ){

            return "Completed";

        }


        if(
            status === "rejected" ||
            status === "مرفوض"
        ){

            return "Rejected";

        }


    }else{


        if(
            status === "pending" ||
            status === "Processing"
        ){

            return "قيد المعالجة";

        }


        if(
            status === "completed" ||
            status === "Completed"
        ){

            return "مكتمل";

        }


        if(
            status === "rejected" ||
            status === "Rejected"
        ){

            return "مرفوض";

        }


    }



    return status;


}




// ==========================================
// LOAD WITHDRAW HISTORY
// ==========================================


function loadWithdrawHistory(){


let withdrawals =

JSON.parse(

localStorage.getItem(
"withdrawals"
)

)

|| [];



let list =
document.getElementById(
"withdrawList"
);



let totalBox =
document.getElementById(
"totalWithdrawals"
);



let amountBox =
document.getElementById(
"totalAmount"
);




let lang =
getWithdrawLanguage();





let text = {


ar:{


empty:
"لا توجد طلبات سحب حتى الآن",


amount:
"المبلغ",


fee:
"العمولة",


receive:
"المستلم",


network:
"الشبكة",


address:
"العنوان",


date:
"التاريخ"


},


en:{


empty:
"No withdrawal requests yet",


amount:
"Amount",


fee:
"Fee",


receive:
"You Receive",


network:
"Network",


address:
"Address",


date:
"Date"


}


};



let t =
text[lang] || text.ar;



list.innerHTML="";



let totalAmount=0;




if(withdrawals.length===0){


list.innerHTML = `

<div class="empty-history">

${t.empty}

</div>

`;


}
// ==========================================
// DISPLAY WITHDRAWALS
// ==========================================


withdrawals.forEach(function(item){


    totalAmount +=
    Number(item.amount) || 0;



    let status =
    translateWithdrawStatus(
        item.status,
        lang
    );



    let card =
    document.createElement("div");



    card.className =
    "withdraw-card";



    card.innerHTML = `


<div class="withdraw-top">


<div class="coin-title">


<div class="mini-coin">

${(item.coin || "USDT").charAt(0)}

</div>


<strong>

${item.coin || "USDT"}

</strong>


</div>




<span class="status pending">

${status}

</span>



</div>





<div class="withdraw-info">


<div>

<span>

${t.amount}

</span>


<b>

${Number(item.amount || 0).toFixed(2)}

${item.coin || "USDT"}

</b>

</div>





<div>

<span>

${t.fee}

</span>


<b class="fee">

${Number(item.fee || 0).toFixed(2)}

${item.coin || "USDT"}

${item.feePercent ? "(" + item.feePercent + "%)" : ""}

</b>


</div>





<div>

<span>

${t.receive}

</span>


<b class="receive">

${Number(item.receive || 0).toFixed(2)}

${item.coin || "USDT"}

</b>


</div>





<div>

<span>

${t.network}

</span>


<b>

${item.network || "-"}

</b>


</div>





<div>

<span>

${t.address}

</span>


<b class="address">

${item.address || "-"}

</b>


</div>





<div>

<span>

${t.date}

</span>


<b>

${item.date || "-"}

</b>


</div>


</div>


`;



list.appendChild(card);



});





// ==========================================
// TOTALS
// ==========================================


totalBox.textContent =
withdrawals.length;



amountBox.textContent =
totalAmount.toFixed(2)
+
" USDT";



}




// ==========================================
// START
// ==========================================


document.addEventListener(
"DOMContentLoaded",
function(){


if(typeof applyLanguage === "function"){

applyLanguage();

}


loadWithdrawHistory();


});





// ==========================================
// LANGUAGE CHANGE
// ==========================================


window.addEventListener(
"storage",
function(e){


if(e.key === "VALORA_LANG"){


loadWithdrawHistory();


if(typeof applyLanguage === "function"){

applyLanguage();

}


}


});



</script>



</body>

</html>
