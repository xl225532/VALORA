<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | سجل السحوبات</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/withdraw-history.css">
<link rel="stylesheet" href="css/background.css">

</head>


<body>


<div class="history-page">


<header class="history-header">


<a href="wallet.html" class="back-btn">

‹

</a>


<h2 data-lang="withdraw_history_title">

سجل السحوبات

</h2>


</header>


<section class="history-summary">


<div class="summary-card">


<span data-lang="total_requests">

إجمالي الطلبات

</span>


<strong id="totalWithdrawals">

0

</strong>


</div>


<div class="summary-card">


<span data-lang="total_amounts">

إجمالي المبالغ

</span>


<strong id="totalAmount">

0.00 USDT

</strong>


</div>


</section>


<section class="withdraw-list" id="withdrawList">

</section>


</div>


<script src="js/language.js"></script>


<script>


// ==========================================
// WITHDRAW HISTORY TRANSLATIONS
// ==========================================

const withdrawHistoryTranslations = {

    ar: {

        withdraw_history_title:
        "سجل السحوبات",

        total_requests:
        "إجمالي الطلبات",

        total_amounts:
        "إجمالي المبالغ",

        no_withdrawals:
        "لا توجد طلبات سحب حتى الآن",

        pending:
        "قيد المعالجة",

        amount:
        "المبلغ",

        fee:
        "العمولة",

        receive:
        "المستلم",

        network:
        "الشبكة",

        address:
        "العنوان",

        date:
        "التاريخ"

    },

    en: {

        withdraw_history_title:
        "Withdrawal History",

        total_requests:
        "Total Requests",

        total_amounts:
        "Total Amounts",

        no_withdrawals:
        "No withdrawal requests yet",

        pending:
        "Processing",

        amount:
        "Amount",

        fee:
        "Fee",

        receive:
        "You Receive",

        network:
        "Network",

        address:
        "Address",

        date:
        "Date"

    }

};


// ==========================================
// GET CURRENT LANGUAGE
// ==========================================

function getWithdrawHistoryLanguage(){

    if(
        typeof window.getLanguage === "function"
    ){

        return window.getLanguage();

    }


    const savedLanguage =
        localStorage.getItem("VALORA_LANG");


    return savedLanguage === "en"
        ? "en"
        : "ar";

}


// ==========================================
// TRANSLATE PAGE
// ==========================================

function translateWithdrawHistory(){

    const lang =
        getWithdrawHistoryLanguage();

    const t =
        withdrawHistoryTranslations[lang] ||
        withdrawHistoryTranslations.ar;


    document.documentElement.lang =
        lang;

    document.documentElement.dir =
        lang === "ar"
        ? "rtl"
        : "ltr";


    document
    .querySelectorAll("[data-lang]")
    .forEach(function(el){

        const key =
            el.getAttribute("data-lang");


        if(
            Object.prototype.hasOwnProperty.call(
                t,
                key
            )
        ){

            el.textContent =
                t[key];

        }

    });

}


// ==========================================
// LOAD WITHDRAW HISTORY
// ==========================================

function loadWithdrawHistory(){


    let withdrawals =

        JSON.parse(

            localStorage.getItem(
                "withdrawals"
            )

        ) || [];


    let list =
        document.getElementById(
            "withdrawList"
        );


    let totalBox =
        document.getElementById(
            "totalWithdrawals"
        );


    let amountBox =
        document.getElementById(
            "totalAmount"
        );


    const lang =
        getWithdrawHistoryLanguage();


    const t =
        withdrawHistoryTranslations[lang] ||
        withdrawHistoryTranslations.ar;


    list.innerHTML = "";


    let totalAmount = 0;


    // ======================================
    // EMPTY HISTORY
    // ======================================

    if(withdrawals.length === 0){


        list.innerHTML = `

            <div class="empty-history">

                <svg viewBox="0 0 24 24">

                    <path d="M6 3H18V21H6Z"></path>

                    <path d="M9 8H15"></path>

                    <path d="M9 12H15"></path>

                    <path d="M9 16H13"></path>

                </svg>


                <p>

                    ${t.no_withdrawals}

                </p>

            </div>

        `;

    }


    // ======================================
    // WITHDRAWALS
    // ======================================

    withdrawals
    .reverse()
    .forEach(function(item){


        totalAmount +=
            Number(item.amount);


        let status =

            item.status === "pending"

            ?

            t.pending

            :

            item.status;


        let card =
            document.createElement("div");


        card.className =
            "withdraw-card";


        card.innerHTML = `


            <div class="withdraw-top">


                <div class="coin-title">


                    <div class="mini-coin">

                        ${item.coin.charAt(0)}

                    </div>


                    <strong>

                        ${item.coin}

                    </strong>


                </div>


                <span class="status pending">

                    ${status}

                </span>


            </div>



            <div class="withdraw-info">


                <div>

                    <span>

                        ${t.amount}

                    </span>


                    <b>

                        ${Number(item.amount).toFixed(2)}

                        ${item.coin}

                    </b>

                </div>



                <div>

                    <span>

                        ${t.fee}

                    </span>


                    <b class="fee">

                        ${Number(item.fee).toFixed(2)}

                        ${item.coin}

                        (${item.feePercent}%)

                    </b>

                </div>



                <div>

                    <span>

                        ${t.receive}

                    </span>


                    <b class="receive">

                        ${Number(item.receive).toFixed(2)}

                        ${item.coin}

                    </b>

                </div>



                <div>

                    <span>

                        ${t.network}

                    </span>


                    <b>

                        ${item.network}

                    </b>

                </div>



                <div>

                    <span>

                        ${t.address}

                    </span>


                    <b class="address">

                        ${item.address}

                    </b>

                </div>



                <div>

                    <span>

                        ${t.date}

                    </span>


                    <b>

                        ${item.date}

                    </b>

                </div>


            </div>

        `;


        list.appendChild(card);


    });


    // ======================================
    // TOTALS
    // ======================================

    totalBox.innerHTML =
        withdrawals.length;


    amountBox.innerHTML =
        totalAmount.toFixed(2)
        +
        " USDT";


}


// ==========================================
// INITIALIZE
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function(){

        translateWithdrawHistory();

        loadWithdrawHistory();

    }
);


// ==========================================
// LANGUAGE CHANGE SUPPORT
// ==========================================

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key === "VALORA_LANG"
        ){

            translateWithdrawHistory();

            loadWithdrawHistory();

        }

    }
);


</script>


</body>

</html>
