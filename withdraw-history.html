<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | سجل السحوبات</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/withdraw-history.css">
<link rel="stylesheet" href="css/background.css">

</head>


<body>


<div class="history-page">



<header class="history-header">


<a href="wallet.html" class="back-btn">

‹

</a>



<h2>

سجل السحوبات

</h2>



</header>









<section class="history-summary">


<div class="summary-card">


<span>

إجمالي الطلبات

</span>


<strong id="totalWithdrawals">

0

</strong>


</div>






<div class="summary-card">


<span>

إجمالي المبالغ

</span>


<strong id="totalAmount">

0.00 USDT

</strong>


</div>



</section>







<section class="withdraw-list" id="withdrawList">

</section>







</div>









<script>


function loadWithdrawHistory(){



let withdrawals =

JSON.parse(

localStorage.getItem("withdrawals")

)

|| [];





let list =

document.getElementById("withdrawList");



let totalBox =

document.getElementById("totalWithdrawals");



let amountBox =

document.getElementById("totalAmount");





list.innerHTML="";



let totalAmount = 0;






if(withdrawals.length === 0){



list.innerHTML = `


<div class="empty-history">


<svg viewBox="0 0 24 24">


<path d="M6 3H18V21H6Z"></path>


<path d="M9 8H15"></path>


<path d="M9 12H15"></path>


<path d="M9 16H13"></path>


</svg>



<p>

لا توجد طلبات سحب حتى الآن

</p>


</div>


`;



}








withdrawals.reverse().forEach(item=>{





totalAmount += Number(item.amount);






let status =

item.status === "pending"

?

"قيد المعالجة"

:

item.status;






let card = document.createElement("div");



card.className="withdraw-card";





card.innerHTML = `


<div class="withdraw-top">


<div class="coin-title">


<div class="mini-coin">

${item.coin.charAt(0)}

</div>


<strong>

${item.coin}

</strong>


</div>





<span class="status pending">

${status}

</span>



</div>







<div class="withdraw-info">



<div>

<span>

المبلغ

</span>


<b>

${Number(item.amount).toFixed(2)}

${item.coin}

</b>

</div>






<div>

<span>

العمولة

</span>


<b class="fee">

${Number(item.fee).toFixed(2)}

${item.coin}

(${item.feePercent}%)

</b>

</div>







<div>

<span>

المستلم

</span>


<b class="receive">

${Number(item.receive).toFixed(2)}

${item.coin}

</b>

</div>







<div>

<span>

الشبكة

</span>


<b>

${item.network}

</b>

</div>







<div>

<span>

العنوان

</span>


<b class="address">

${item.address}

</b>

</div>







<div>

<span>

التاريخ

</span>


<b>

${item.date}

</b>

</div>



</div>


`;





list.appendChild(card);



});








totalBox.innerHTML =

withdrawals.length;





amountBox.innerHTML =

totalAmount.toFixed(2)

+

" USDT";





}







document.addEventListener(

"DOMContentLoaded",

loadWithdrawHistory

);



</script>






</body>


</html>
