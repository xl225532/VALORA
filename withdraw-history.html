<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | سجل السحوبات</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/withdraw-history.css">

</head>



<body>



<div class="dashboard">





<header class="header">

<div class="brand">

VALORA

</div>

</header>







<section class="page-title">


<div class="icon-box">

▤

</div>



<h2>

سجل السحوبات

</h2>



<p>

تابع جميع عمليات السحب الخاصة بك

</p>


</section>








<section class="history-list" id="historyList">




<!-- تظهر عمليات السحب هنا تلقائياً -->



</section>







</section>









<nav class="bottom-nav">


<a href="dashboard.html">

⌂

<br>

الرئيسية

</a>




<a href="wallet.html">

▣

<br>

المحفظة

</a>




<a href="team.html">

♟

<br>

الفريق

</a>




<a href="settings.html">

⚙

<br>

الإعدادات

</a>



</nav>







</div>








<script>


let historyList = document.getElementById("historyList");



let withdrawals = JSON.parse(localStorage.getItem("withdrawals")) || [];





if(withdrawals.length === 0){


historyList.innerHTML = `

<div class="history-card">


<div class="history-data">


<p>

لا توجد عمليات سحب

</p>


</div>


</div>

`;


}

else{



withdrawals.reverse().forEach(function(item){



let statusClass = "pending";

let statusText = "قيد المعالجة";



if(item.status === "complete"){

statusClass="complete";

statusText="مكتمل";

}


if(item.status === "rejected"){

statusClass="rejected";

statusText="رفض";

}




historyList.innerHTML += `


<div class="history-card">



<div class="history-top">


<div class="coin-mini usdt">

₮

</div>



<div class="coin-info">


<strong>

${item.coin}

</strong>


<small>

${item.network}

</small>


</div>



<span class="status ${statusClass}">

${statusText}

</span>



</div>







<div class="history-data">


<p>

المبلغ

<span>

${item.amount} USDT

</span>

</p>



<p>

التاريخ

<span>

${item.date}

</span>

</p>



<p>

العنوان

<span>

${item.address}

</span>

</p>



</div>



</div>


`;



});



}



</script>






</body>

</html>
