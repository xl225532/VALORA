<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | سجل السحوبات</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/withdraw-history.css">
<link rel="stylesheet" href="css/background.css">

</head>


<body>


<div class="history-page">



<header class="history-header">


<a href="wallet.html" class="back-btn">

‹

</a>


<h2>

سجل السحوبات

</h2>



</header>








<section class="history-summary">


<div class="summary-card">


<span>

إجمالي الطلبات

</span>


<strong id="totalWithdrawals">

0

</strong>


</div>






<div class="summary-card">


<span>

إجمالي المبالغ

</span>


<strong id="totalAmount">

0.00 USDT

</strong>


</div>



</section>







<section class="withdraw-list" id="withdrawList">


</section>
<script>


function loadWithdrawHistory(){



let withdrawals =

JSON.parse(

localStorage.getItem("withdrawals")

)

|| [];







let list =

document.getElementById("withdrawList");



let totalBox =

document.getElementById("totalWithdrawals");



let amountBox =

document.getElementById("totalAmount");






list.innerHTML="";





let totalAmount = 0;







if(withdrawals.length === 0){



list.innerHTML = `

<div class="empty-history">

لا توجد طلبات سحب حتى الآن

</div>

`;



}







withdrawals.forEach((item)=>{



totalAmount +=

Number(item.amount);








let card =

document.createElement("div");





card.className="withdraw-card";







card.innerHTML = `


<div class="withdraw-top">


<strong>

${item.coin}

</strong>



<span class="pending">

${item.status}

</span>


</div>






<div class="withdraw-info">


<p>

الشبكة:

<b>

${item.network}

</b>

</p>



<p>

المبلغ:

<b>

${Number(item.amount).toFixed(2)}

${item.coin}

</b>

</p>




<p>

العنوان:

<b class="address">

${item.address}

</b>

</p>




<p>

التاريخ:

<b>

${item.date}

</b>

</p>



</div>


`;







list.appendChild(card);



});









totalBox.innerHTML =

withdrawals.length;






amountBox.innerHTML =

totalAmount.toFixed(2)

+

" USDT";





}






document.addEventListener(

"DOMContentLoaded",

loadWithdrawHistory

);



</script>




</div>


</body>


</html>
