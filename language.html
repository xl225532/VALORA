<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | Language</title>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="css/settings.css">

<link rel="stylesheet" href="css/background.css">

<link rel="stylesheet" href="css/language.css">

</head>


<body>


<div class="settings-container">


    <!-- =========================
         Header
    ========================== -->

    <div class="settings-header">

        <h2>
            🌐 Language
        </h2>

        <p>
            Choose your preferred language
        </p>

    </div>



    <!-- =========================
         Languages
    ========================== -->

    <div class="language-card">


        <!-- English -->

        <div
            class="language-item"
            onclick="setLanguage('en')"
        >

            <div class="language-left">

                <div class="language-flag">
                    🇺🇸
                </div>


                <div>

                    <div class="language-title">
                        English
                    </div>

                    <div class="language-subtitle">
                        Default Language
                    </div>

                </div>

            </div>


            <div
                class="language-radio"
                id="radio-en"
            >

                <div class="radio-dot"></div>

            </div>

        </div>



        <!-- Arabic -->

        <div
            class="language-item"
            onclick="setLanguage('ar')"
        >

            <div class="language-left">

                <div class="language-flag">
                    🇸🇦
                </div>


                <div>

                    <div class="language-title">
                        العربية
                    </div>

                    <div class="language-subtitle">
                        Arabic
                    </div>

                </div>

            </div>


            <div
                class="language-radio"
                id="radio-ar"
            >

                <div class="radio-dot"></div>

            </div>

        </div>


    </div>



    <!-- =========================
         Save Info
    ========================== -->

    <div class="save-info">

        سيتم حفظ اللغة تلقائياً

    </div>


</div>



<!-- =========================
     Language System
========================== -->

<script src="js/language.js"></script>



<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const currentLanguage =
            localStorage.getItem("VALORA_LANG") || "en";


        const englishRadio =
            document.getElementById("radio-en");


        const arabicRadio =
            document.getElementById("radio-ar");


        if (englishRadio) {

            englishRadio.classList.remove("active");

        }


        if (arabicRadio) {

            arabicRadio.classList.remove("active");

        }


        if (currentLanguage === "ar") {

            if (arabicRadio) {

                arabicRadio.classList.add("active");

            }

        } else {

            if (englishRadio) {

                englishRadio.classList.add("active");

            }

        }

    }
);

</script>


</body>

</html>
