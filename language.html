<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | Language</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/background.css">
<link rel="stylesheet" href="css/language.css">

</head>


<body>


<div class="settings-container">



<header class="settings-header">


<h2 data-lang="language_title">

🌐 Language

</h2>


<p data-lang="language_subtitle">

Choose your preferred language

</p>


</header>






<div class="language-card">



<!-- English -->

<div class="language-item" onclick="setLanguage('en')">



<div class="language-left">


<div class="language-flag">

🇺🇸

</div>



<div>


<div class="language-title" data-lang="english">

English

</div>



<div class="language-subtitle" data-lang="default_language">

Default Language

</div>


</div>


</div>




<div class="language-radio" id="radio-en">


<div class="radio-dot"></div>


</div>



</div>







<!-- Arabic -->

<div class="language-item" onclick="setLanguage('ar')">



<div class="language-left">


<div class="language-flag">

🇸🇦

</div>



<div>


<div class="language-title" data-lang="arabic">

العربية

</div>



<div class="language-subtitle">

Arabic

</div>


</div>


</div>




<div class="language-radio" id="radio-ar">


<div class="radio-dot"></div>


</div>



</div>





</div>







<div class="save-info" data-lang="save_language">

سيتم حفظ اللغة تلقائياً

</div>





</div>







<script src="js/language.js"></script>



<script>


document.addEventListener(
"DOMContentLoaded",
function(){


const current =
localStorage.getItem("VALORA_LANG")
|| "en";



const en =
document.getElementById("radio-en");


const ar =
document.getElementById("radio-ar");



if(current === "en"){


en.classList.add("active");


}else{


ar.classList.add("active");


}



if(typeof applyLanguage === "function"){


applyLanguage();


}


});



</script>





</body>

</html>
