<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | اللغة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/css/language.css">

</head>


<body>


<div class="language-page">



<header class="page-header">

<a href="settings.html">

‹

</a>


<h2>

اختيار اللغة

</h2>


</header>








<section class="language-card">



<div class="language-item active">

<span>

🇸🇦

العربية

</span>


<b>

✓

</b>


</div>





<div class="language-item">

<span>

🇺🇸

English

</span>

</div>






<div class="language-item">

<span>

🇪🇸

Español

</span>

</div>







<div class="language-item">

<span>

🇫🇷

Français

</span>

</div>







<div class="language-item">

<span>

🇩🇪

Deutsch

</span>

</div>







<div class="language-item">

<span>

🇹🇷

Türkçe

</span>

</div>







<div class="language-item">

<span>

🇷🇺

Русский

</span>

</div>







<div class="language-item">

<span>

🇨🇳

中文

</span>

</div>







<div class="language-item">

<span>

🇯🇵

日本語

</span>

</div>






<div class="language-item">

<span>

🇰🇷

한국어

</span>

</div>







<div class="language-item">

<span>

🇮🇹

Italiano

</span>

</div>







<div class="language-item">

<span>

🇵🇹

Português

</span>

</div>






</section>








</div>







<script>


let languages = document.querySelectorAll(".language-item");



languages.forEach(function(item){



item.onclick = function(){



languages.forEach(function(lang){


lang.classList.remove("active");



let check = lang.querySelector("b");


if(check){

check.remove();

}


});





item.classList.add("active");





let mark = document.createElement("b");


mark.innerHTML="✓";


item.appendChild(mark);





localStorage.setItem(

"VALORA_LANGUAGE",

item.innerText.trim()

);



};



});



</script>





</body>

</html>
