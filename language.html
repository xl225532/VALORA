<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | اللغة</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/css/language.css">

</head>


<body>


<div class="language-page">



<header class="page-header">

<a href="settings.html">

‹

</a>


<h2>
اختيار اللغة
</h2>


</header>







<section class="language-card">



<div class="language-item active" data-lang-code="ar">

<span>

🇸🇦 العربية

</span>


<b>✓</b>


</div>





<div class="language-item" data-lang-code="en">

<span>

🇺🇸 English

</span>


</div>






<div class="language-item">

<span>

🇪🇸 Español

</span>

</div>





<div class="language-item">

<span>

🇫🇷 Français

</span>

</div>





<div class="language-item">

<span>

🇩🇪 Deutsch

</span>

</div>





<div class="language-item">

<span>

🇹🇷 Türkçe

</span>

</div>





<div class="language-item">

<span>

🇷🇺 Русский

</span>

</div>





<div class="language-item">

<span>

🇨🇳 中文

</span>

</div>





<div class="language-item">

<span>

🇯🇵 日本語

</span>

</div>





<div class="language-item">

<span>

🇰🇷 한국어

</span>

</div>





<div class="language-item">

<span>

🇮🇹 Italiano

</span>

</div>





<div class="language-item">

<span>

🇵🇹 Português

</span>

</div>






</section>








</div>









<script src="js/language.js"></script>


<script>



let selectedLanguage =
localStorage.getItem("VALORA_LANG") || "ar";





document.querySelectorAll(".language-item").forEach(function(item){



item.onclick=function(){



document.querySelectorAll(".language-item")
.forEach(function(lang){



lang.classList.remove("active");



let oldCheck =
lang.querySelector("b");



if(oldCheck){

oldCheck.remove();

}


});





item.classList.add("active");



let check=document.createElement("b");

check.innerHTML="✓";


item.appendChild(check);





if(item.dataset.langCode){



selectedLanguage=item.dataset.langCode;



changeLanguage(selectedLanguage);



}



};



});







function changeLanguage(lang){



localStorage.setItem(
"VALORA_LANG",
lang
);



showMessage("✓ تم تغيير اللغة");



if(typeof applyLanguage === "function"){


applyLanguage();


}



}







function showMessage(text){



let msg=document.createElement("div");



msg.innerText=text;



msg.style.position="fixed";

msg.style.top="15px";

msg.style.left="50%";

msg.style.transform="translateX(-50%)";

msg.style.background="#1687FF";

msg.style.color="#fff";

msg.style.padding="8px 20px";

msg.style.borderRadius="20px";

msg.style.fontSize="13px";

msg.style.zIndex="9999";



document.body.appendChild(msg);



setTimeout(function(){


msg.remove();


},2000);



}






</script>





</body>

</html>
