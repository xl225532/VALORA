<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | اللغة</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/css/language.css">


</head>


<body>


<div class="language-page">



<header class="page-header">

<a href="settings.html">

‹

</a>


<h2>

اختيار اللغة

</h2>


</header>







<section class="language-card">



<div class="language-item active" data-lang-code="ar">


<span>

🇸🇦

العربية

</span>


<b>

✓

</b>


</div>





<div class="language-item" data-lang-code="en">


<span>

🇺🇸

English

</span>


</div>






<div class="language-item">

<span>

🇪🇸

Español

</span>

</div>







<div class="language-item">

<span>

🇫🇷

Français

</span>

</div>







<div class="language-item">

<span>

🇩🇪

Deutsch

</span>

</div>







<div class="language-item">

<span>

🇹🇷

Türkçe

</span>

</div>







<div class="language-item">

<span>

🇷🇺

Русский

</span>

</div>







<div class="language-item">

<span>

🇨🇳

中文

</span>

</div>







<div class="language-item">

<span>

🇯🇵

日本語

</span>

</div>






<div class="language-item">

<span>

🇰🇷

한국어

</span>

</div>







<div class="language-item">

<span>

🇮🇹

Italiano

</span>

</div>







<div class="language-item">

<span>

🇵🇹

Português

</span>

</div>







<button class="confirm-language" onclick="confirmLanguage()">

✓ تأكيد اللغة

</button>



</section>








</div>







<script>


let selectedLanguage = "ar";



document.querySelectorAll(".language-item").forEach(function(item){



item.onclick=function(){



document.querySelectorAll(".language-item")
.forEach(function(lang){


lang.classList.remove("active");



let check = lang.querySelector("b");


if(check){

check.remove();

}


});





item.classList.add("active");



let mark = document.createElement("b");

mark.innerHTML="✓";


item.appendChild(mark);



if(item.dataset.langCode){


selectedLanguage = item.dataset.langCode;


}



};



});







function confirmLanguage(){



localStorage.setItem(

"VALORA_LANG",

selectedLanguage

);



location.reload();



}



</script>







</body>

</html>
