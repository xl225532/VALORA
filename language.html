<script src="js/language.js"></script>


<script>


let selectedLanguage =
localStorage.getItem("VALORA_LANG") || "ar";





function loadSelectedLanguage(){


document.querySelectorAll(".language-item")
.forEach(function(item){


item.classList.remove("active");



let oldCheck=item.querySelector("b");


if(oldCheck){

oldCheck.remove();

}




if(item.dataset.langCode === selectedLanguage){


item.classList.add("active");



let check=document.createElement("b");

check.innerHTML="✓";


item.appendChild(check);



}



});


}




loadSelectedLanguage();






document.querySelectorAll(".language-item")
.forEach(function(item){



item.onclick=function(){



if(!item.dataset.langCode){

return;

}



selectedLanguage=item.dataset.langCode;



localStorage.setItem(
"VALORA_LANG",
selectedLanguage
);




loadSelectedLanguage();





if(typeof applyLanguage === "function"){

applyLanguage();

}





showMessage("✓ تم تغيير اللغة");



};



});







function showMessage(text){


let msg=document.createElement("div");


msg.innerText=text;



msg.style.position="fixed";

msg.style.top="15px";

msg.style.left="50%";

msg.style.transform="translateX(-50%)";

msg.style.background="#1687FF";

msg.style.color="#fff";

msg.style.padding="8px 20px";

msg.style.borderRadius="20px";

msg.style.fontSize="13px";

msg.style.zIndex="9999";



document.body.appendChild(msg);



setTimeout(function(){


msg.remove();


},2000);



}



</script>



</body>
