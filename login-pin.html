>

class="field-error"

</div>

onclick="saveLoginPin()"

<!-- ==========================================
     LANGUAGE SYSTEM
========================================== -->

<script src="js/language.js"></script>


<script>

if(typeof applyLanguage === "function"){

    applyLanguage();

}


/* ==========================================
   LOGIN PIN
========================================== */

function saveLoginPin(){

    const currentPin =
        document.getElementById("currentPin").value.trim();

    const newPin =
        document.getElementById("newPin").value.trim();

    const confirmPin =
        document.getElementById("confirmPin").value.trim();


    const currentError =
        document.getElementById("currentPinError");

    const newError =
        document.getElementById("newPinError");

    const confirmError =
        document.getElementById("confirmPinError");


    currentError.textContent = "";
    newError.textContent = "";
    confirmError.textContent = "";


    document.getElementById("currentPin")
        .classList.remove("error");

    document.getElementById("newPin")
        .classList.remove("error");

    document.getElementById("confirmPin")
        .classList.remove("error");


    const lang =
        typeof getLanguage === "function"
            ? getLanguage()
            : "ar";


    const text = {

        ar: {

            currentRequired:
                "أدخل رمز الدخول الحالي",

            currentWrong:
                "رمز الدخول الحالي غير صحيح",

            newRequired:
                "أدخل رمز الدخول الجديد",

            newLength:
                "يجب أن يتكون رمز الدخول من 6 أرقام",

            confirmRequired:
                "أعد إدخال رمز الدخول الجديد",

            notMatch:
                "رمز الدخول غير متطابق",

            success:
                "تم تغيير رمز الدخول بنجاح"

        },


        en: {

            currentRequired:
                "Enter your current login code",

            currentWrong:
                "The current login code is incorrect",

            newRequired:
                "Enter the new login code",

            newLength:
                "The login code must contain 6 digits",

            confirmRequired:
                "Re-enter the new login code",

            notMatch:
                "The login codes do not match",

            success:
                "Login code changed successfully"

        }

    };


    const t =
        text[lang] || text.ar;



    /* CURRENT PIN */

    const savedPin =
        localStorage.getItem("VALORA_LOGIN_PIN");


    if(savedPin && currentPin !== savedPin){

        currentError.textContent =
            t.currentWrong;

        document.getElementById("currentPin")
            .classList.add("error");

        return;

    }


    if(!savedPin && currentPin === ""){

        currentError.textContent =
            t.currentRequired;

        document.getElementById("currentPin")
            .classList.add("error");

        return;

    }



    /* NEW PIN */

    if(newPin === ""){

        newError.textContent =
            t.newRequired;

        document.getElementById("newPin")
            .classList.add("error");

        return;

    }


    if(!/^\d{6}$/.test(newPin)){

        newError.textContent =
            t.newLength;

        document.getElementById("newPin")
            .classList.add("error");

        return;

    }



    /* CONFIRM */

    if(confirmPin === ""){

        confirmError.textContent =
            t.confirmRequired;

        document.getElementById("confirmPin")
            .classList.add("error");

        return;

    }


    if(newPin !== confirmPin){

        confirmError.textContent =
            t.notMatch;

        document.getElementById("confirmPin")
            .classList.add("error");

        return;

    }



    /* SAVE */

    localStorage.setItem(
        "VALORA_LOGIN_PIN",
        newPin
    );


    alert(t.success);


    window.location.href =
        "settings.html";

}

</script>


</body>
