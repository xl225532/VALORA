<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVAEX - تسجيل الدخول</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}


body{

margin:0;
height:100vh;

background:#050b16;

display:flex;
align-items:center;
justify-content:center;

color:white;

}



.login-box{

width:90%;
max-width:400px;

background:#0b1628;

padding:35px;

border-radius:22px;

box-shadow:0 0 35px rgba(0,120,255,0.15);

}



.logo{

text-align:center;

font-size:34px;

font-weight:bold;

color:#1687ff;

margin-bottom:10px;

}



.title{

text-align:center;

color:#aab6c8;

margin-bottom:30px;

}



.input-box{

margin-bottom:18px;

}



label{

display:block;

margin-bottom:8px;

color:#c5d0df;

font-size:14px;

}



input{

width:100%;

padding:14px;

border-radius:12px;

border:1px solid #233550;

background:#071426;

color:white;

font-size:15px;

outline:none;

}



input:focus{

border-color:#1687ff;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#0878ff;

color:white;

font-size:17px;

cursor:pointer;

margin-top:10px;

}



button:hover{

background:#0068dd;

}



.options{

display:flex;

justify-content:space-between;

margin-top:15px;

font-size:13px;

}



.options a{

color:#1687ff;

text-decoration:none;

}



.register{

text-align:center;

margin-top:25px;

color:#9ba8bc;

}



.register a{

color:#1687ff;

text-decoration:none;

font-weight:bold;

}



</style>

</head>


<body>


<div class="login-box">


<div class="logo">
NOVAEX
</div>


<div class="title">
تسجيل الدخول إلى حسابك
</div>



<form>


<div class="input-box">

<label>
البريد الإلكتروني أو اسم المستخدم
</label>

<input 
type="text"
placeholder="أدخل البريد أو اسم المستخدم"
>


</div>




<div class="input-box">

<label>
كلمة المرور
</label>

<input 
type="password"
placeholder="أدخل كلمة المرور"
>


</div>




<button type="submit">

تسجيل الدخول

</button>



</form>




<div class="options">

<a href="#">
نسيت كلمة المرور؟
</a>


<a href="register.html">
إنشاء حساب
</a>

</div>



<div class="register">

ليس لديك حساب؟

<a href="register.html">
سجل الآن
</a>

</div>



</div>



</body>

</html>
