<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | تسجيل الدخول</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{

background:#050B16;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

color:#fff;

}


.login-container{

width:90%;

max-width:420px;

background:#0B1628;

border-radius:20px;

padding:35px;

box-shadow:0 0 35px rgba(0,140,255,.15);

}


.logo{

text-align:center;

font-size:36px;

font-weight:700;

color:#1687FF;

margin-bottom:8px;

}


.subtitle{

text-align:center;

color:#98A5B8;

margin-bottom:30px;

font-size:15px;

}


.input-group{

margin-bottom:18px;

}


label{

display:block;

margin-bottom:8px;

font-size:14px;

color:#C6D3E4;

}


input{

width:100%;

padding:14px;

background:#071426;

border:1px solid #20344F;

border-radius:12px;

color:#fff;

font-size:15px;

outline:none;

transition:.3s;

}


input:focus{

border-color:#1687FF;

}


.login-btn{

width:100%;

padding:15px;

background:#1687FF;

border:none;

border-radius:12px;

color:white;

font-size:17px;

font-weight:700;

cursor:pointer;

transition:.3s;

}


.login-btn:hover{

background:#0B72DE;

}


.links{

display:flex;

justify-content:space-between;

margin-top:18px;

font-size:14px;

}


.links a{

color:#1687FF;

text-decoration:none;

}


.register{

margin-top:25px;

text-align:center;

color:#9CA9BB;

}


.register a{

color:#1687FF;

text-decoration:none;

font-weight:bold;

}

</style>

</head>

<body>

<div class="login-container">

<div class="logo">
VALORA
</div>

<div class="subtitle">
تسجيل الدخول إلى حسابك
</div>

<form>

<div class="input-group">

<label>
البريد الإلكتروني أو اسم المستخدم
</label>

<input
type="text"
placeholder="أدخل البريد الإلكتروني أو اسم المستخدم"
required>

</div>

<div class="input-group">

<label>
كلمة المرور
</label>

<input
type="password"
placeholder="أدخل كلمة المرور"
required>

</div>

<button class="login-btn" type="submit">
تسجيل الدخول
</button>

</form>

<div class="links">

<a href="#">
نسيت كلمة المرور؟
</a>

<a href="register.html">
إنشاء حساب
</a>

</div>

<div class="register">

ليس لديك حساب؟

<a href="register.html">
إنشاء حساب جديد
</a>

</div>

</div>

</body>

</html>
