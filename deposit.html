<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | الإيداع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/deposit.css">

</head>


<body class="valora-deposit">


<div class="deposit-container">



<header class="deposit-header">

<div class="deposit-logo">
VALORA
</div>

</header>





<section class="deposit-title">

<div class="deposit-icon">
↓
</div>


<h2>
إيداع العملات
</h2>


<p>
اختر العملة والشبكة للإيداع
</p>

</section>








<section class="deposit-coins">



<button class="deposit-coin active" onclick="selectCoin('USDT',this)">

<div class="deposit-coin-icon usdt">
₮
</div>

<div>
<strong>USDT</strong>
<small>Tether</small>
</div>

</button>






<button class="deposit-coin" onclick="selectCoin('BTC',this)">

<div class="deposit-coin-icon btc">
₿
</div>

<div>
<strong>BTC</strong>
<small>Bitcoin</small>
</div>

</button>






<button class="deposit-coin" onclick="selectCoin('ETH',this)">

<div class="deposit-coin-icon eth">
◆
</div>

<div>
<strong>ETH</strong>
<small>Ethereum</small>
</div>

</button>






<button class="deposit-coin" onclick="selectCoin('TRX',this)">

<div class="deposit-coin-icon trx">
TRX
</div>

<div>
<strong>TRX</strong>
<small>TRON</small>
</div>

</button>



</section>
<section class="deposit-card">


<h3>
شبكة الإيداع
</h3>


<div class="network-buttons" id="networkBox">


</div>






<h3>
عنوان الإيداع
</h3>




<div class="address-area">


<input 
type="text"
id="depositAddress"
value=""
readonly>



<button onclick="copyDeposit()">

نسخ

</button>



</div>






<div class="deposit-warning">

⚠️ تأكد من اختيار الشبكة الصحيحة قبل الإيداع.  
إرسال العملات عبر شبكة غير صحيحة قد يؤدي إلى فقدانها.

<br><br>

الحد الأدنى للإيداع: 100 USDT

</div>



</section>



</div>








<script>


let currentCoin="USDT";

let currentNetwork="TRC20";





let coinNetworks={


USDT:[
"TRC20",
"ERC20"
],


BTC:[
"Bitcoin"
],


ETH:[
"ERC20"
],


TRX:[
"TRC20"
]


};







let addresses={


USDT:{

TRC20:"TXXXXXXXXXXXXXXXXXXXXXXXX",

ERC20:"0xUSDTXXXXXXXXXXXXXXXX"

},


BTC:{

Bitcoin:"bc1BTCXXXXXXXXXXXXXXXX"

},


ETH:{

ERC20:"0xETHXXXXXXXXXXXXXXXX"

},


TRX:{

TRC20:"TXTRONXXXXXXXXXXXXXXXX"

}


};








function selectCoin(coin,button){


currentCoin=coin;



document.querySelectorAll(".deposit-coin")
.forEach(btn=>btn.classList.remove("active"));



button.classList.add("active");



loadNetworks();


updateAddress();


}







function loadNetworks(){


let box=document.getElementById("networkBox");


box.innerHTML="";



coinNetworks[currentCoin].forEach((network,index)=>{


let btn=document.createElement("button");



btn.className="network";



btn.innerText=network;



if(index===0){


btn.classList.add("active");


currentNetwork=network;


}



btn.onclick=function(){


selectNetwork(this,network);


};



box.appendChild(btn);



});


}







function selectNetwork(button,network){


currentNetwork=network;



document.querySelectorAll(".network")
.forEach(btn=>btn.classList.remove("active"));



button.classList.add("active");



updateAddress();



}







function updateAddress(){


document.getElementById("depositAddress").value =
addresses[currentCoin][currentNetwork];


}







function copyDeposit(){


let address =
document.getElementById("depositAddress").value;



navigator.clipboard.writeText(address);



alert("تم نسخ عنوان الإيداع");


}







loadNetworks();

updateAddress();


</script>


</body>

</html>
