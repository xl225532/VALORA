<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | الإيداع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/deposit.css">

</head>


<body class="valora-deposit">


<div class="deposit-container">



<header class="deposit-header">

<div class="deposit-logo">
VALORA
</div>

</header>





<section class="deposit-title">

<div class="deposit-icon">
↓
</div>

<h2>
إيداع العملات
</h2>

<p>
اختر العملة والشبكة للإيداع
</p>

</section>







<section class="deposit-coins">



<button class="deposit-coin active" onclick="selectCoin('USDT',this)">

<div class="deposit-coin-icon usdt">
₮
</div>

<div>
<strong>USDT</strong>
<small>Tether</small>
</div>

</button>





<button class="deposit-coin" onclick="selectCoin('BTC',this)">

<div class="deposit-coin-icon btc">
₿
</div>

<div>
<strong>BTC</strong>
<small>Bitcoin</small>
</div>

</button>





<button class="deposit-coin" onclick="selectCoin('ETH',this)">

<div class="deposit-coin-icon eth">
◆
</div>

<div>
<strong>ETH</strong>
<small>Ethereum</small>
</div>

</button>





<button class="deposit-coin" onclick="selectCoin('BNB',this)">

<div class="deposit-coin-icon bnb">
◆
</div>

<div>
<strong>BNB</strong>
<small>Binance</small>
</div>

</button>



</section>








<section class="deposit-card">


<h3>
شبكة الإيداع
</h3>



<div class="network-buttons">


<button class="network active" onclick="selectNetwork(this,'TRC20')">
TRC20
</button>


<button class="network" onclick="selectNetwork(this,'ERC20')">
ERC20
</button>


</div>








<h3>
عنوان الإيداع
</h3>





<div class="address-area">


<input 
type="text"
id="depositAddress"
value="TXXXXXXXXXXXXXXXXXXXXXXXX"
readonly>



<button onclick="copyDeposit()">
نسخ
</button>



</div>






<div class="deposit-warning">

⚠️ تأكد من اختيار الشبكة الصحيحة قبل الإيداع. إرسال العملات عبر شبكة غير صحيحة قد يؤدي إلى فقدانها.

<br><br>

الحد الأدنى للإيداع: 100 USDT

</div>



</section>







</div>








<script>


let currentCoin="USDT";

let currentNetwork="TRC20";



let addresses={

USDT:{
TRC20:"TXXXXXXXXXXXXXXXXXXXXXXXX",
ERC20:"0xUSDTXXXXXXXXXXXXXXXX"
},

BTC:{
TRC20:"bc1BTCXXXXXXXXXXXXXXXX",
ERC20:"bc1BTCERCXXXXXXXXXXXXXXXX"
},

ETH:{
TRC20:"0xETHXXXXXXXXXXXXXXXX",
ERC20:"0xETHERCXXXXXXXXXXXXXXXX"
},

BNB:{
TRC20:"bnbXXXXXXXXXXXXXXXX",
ERC20:"0xBNBXXXXXXXXXXXXXXXX"
}

};






function selectCoin(coin,button){


currentCoin=coin;


document.querySelectorAll(".deposit-coin")
.forEach(btn=>btn.classList.remove("active"));


button.classList.add("active");


updateAddress();


}







function selectNetwork(button,network){


currentNetwork=network;


document.querySelectorAll(".network")
.forEach(btn=>btn.classList.remove("active"));


button.classList.add("active");


updateAddress();


}






function updateAddress(){


document.getElementById("depositAddress").value =
addresses[currentCoin][currentNetwork];


}






function copyDeposit(){


let address =
document.getElementById("depositAddress").value;


navigator.clipboard.writeText(address);


alert("تم نسخ عنوان الإيداع");
}

</script>

</body>

</html>
