<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | إنشاء حساب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/register.css">

</head>


<body>


<div class="auth-container">


<div class="logo">
VALORA
</div>


<div class="auth-title">
إنشاء حساب جديد
</div>



<form id="registerForm">



<div class="input-group">

<label>
البريد الإلكتروني أو رقم الهاتف
</label>

<input
type="text"
id="contact"
placeholder="أدخل البريد الإلكتروني أو رقم الهاتف"
required>

</div>





<div class="input-group">

<label>
كلمة المرور
</label>

<input
type="password"
id="password"
placeholder="********"
required>

</div>





<div class="input-group">

<label>
تأكيد كلمة المرور
</label>

<input
type="password"
id="confirmPassword"
placeholder="********"
required>

</div>





<div class="input-group">

<label>
كود الدعوة
</label>

<input
type="text"
id="inviteCode"
placeholder="أدخل كود الدعوة">

</div>





<div class="checkbox-group">

<input
type="checkbox"
id="agree"
required>


<label for="agree">

أوافق على الشروط والأحكام وسياسة الخصوصية

</label>


</div>





<button
type="submit"
class="btn-primary">

إنشاء الحساب

</button>



</form>





<div class="bottom-link">

لديك حساب بالفعل؟

<a href="login.html">
تسجيل الدخول
</a>


</div>



</div>




<script src="app.js"></script>


</body>

</html>
