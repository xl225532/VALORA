<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA | إنشاء حساب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/register.css">
<link rel="stylesheet" href="css/background.css">

</head>

<body>


<div class="auth-container">


<div class="logo">


<div class="logo-icon">

<svg viewBox="0 0 64 64">

<path d="M32 6 L54 18 V34 C54 47 45 56 32 60 C19 56 10 47 10 34 V18 Z"
fill="#1687FF"/>

<path d="M22 24 L32 44 L42 24"
stroke="#ffffff"
stroke-width="4"
fill="none"
stroke-linecap="round"/>

</svg>

</div>


<div class="logo-name">
VALORA
</div>


<div class="logo-sub">
EXCHANGE
</div>


</div>



<div class="auth-title">
إنشاء حساب جديد
</div>



<form id="registerForm">



<div class="input-group">

<label>
البريد الإلكتروني أو رقم الهاتف
</label>


<input

type="text"

id="contact"

placeholder="أدخل البريد الإلكتروني أو رقم الهاتف"

required>

</div>





<div class="input-group">

<label>
كود التحقق
</label>


<div class="verify-box">


<input

type="text"

id="verifyCode"

maxlength="6"

placeholder="أدخل كود التحقق">


<button

type="button"

class="verify-btn"

onclick="sendVerificationCode()">

تحقق

</button>


</div>


</div>






<div class="input-group">

<label>
كلمة المرور
</label>


<div class="password-box">


<input

type="password"

id="password"

placeholder="********"

required>



<button

type="button"

class="eye-btn"

onclick="togglePassword('password',this)">


<svg viewBox="0 0 24 24">

<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>

<circle cx="12" cy="12" r="3"/>

</svg>


</button>


</div>

</div>





<div class="input-group">

<label>
تأكيد كلمة المرور
</label>


<div class="password-box">


<input

type="password"

id="confirmPassword"

placeholder="********"

required>



<button

type="button"

class="eye-btn"

onclick="togglePassword('confirmPassword',this)">


<svg viewBox="0 0 24 24">

<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>

<circle cx="12" cy="12" r="3"/>

</svg>


</button>


</div>

</div>







<div class="input-group">

<label>
كود الدعوة
</label>


<input

type="text"

id="inviteCode"

placeholder="يتم تعبئته تلقائياً من رابط الدعوة">


</div>






<div class="checkbox-group">


<label class="circle-check">


<input

type="checkbox"

id="agree"

required>


<span></span>


</label>


<label>

أوافق على


<a href="terms.html" target="_blank">

الشروط والأحكام وسياسة الخصوصية

</a>


</label>


</div>






<button

type="submit"

class="btn-primary">

إنشاء الحساب

</button>



</form>







<div class="bottom-link">

لديك حساب بالفعل؟


<a href="login.html">

تسجيل الدخول

</a>


</div>





</div>



<script src="js/app.js"></script>


</body>

</html>
