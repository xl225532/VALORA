<!-- ==========================================
     LANGUAGE SYSTEM
========================================== -->

<script src="js/language.js"></script>


<script>

if(typeof applyLanguage === "function"){

    applyLanguage();

}


function sendMessage(){

    const input =
        document.getElementById("supportMessage");

    const chat =
        document.getElementById("chatBox");

    const text =
        input.value.trim();


    if(text === ""){

        const lang =
            typeof getLanguage === "function"
                ? getLanguage()
                : "ar";


        alert(
            lang === "en"
                ? "Please write your message first"
                : "اكتب رسالتك أولاً"
        );

        return;

    }


    const msg =
        document.createElement("div");


    msg.className =
        "message user";


    msg.textContent =
        text;


    chat.appendChild(msg);


    chat.scrollTop =
        chat.scrollHeight;


    input.value = "";

}

</script>
